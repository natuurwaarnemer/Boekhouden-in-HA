  # =========================================================
  # View 5: Financieel Overzicht
  # =========================================================
  - title: "📊 Overzicht"
    path: overzicht
    icon: mdi:chart-bar
    cards:

      - type: markdown
        content: |
          ## 📊 Financieel Overzicht — Natuurwaarnemer ERP

          Hier komen de rapportage-kaarten zodra de grootboekflow actief is.
          Gebruik de n8n `/grootboek-rapport?periode=JJJJ-MM` webhook voor live data.

          **Tip:** Voeg onderstaande `rest` sensor toe aan `configuration.yaml`:

          ```yaml
          sensor:
            - platform: rest
              name: erp_rapport
              resource: "http://n8n:5678/webhook/grootboek-rapport"
              params:
                periode: "{{ now().strftime('%Y-%m') }}"
              value_template: "{{ value_json.omzet }}"
              json_attributes:
                - omzet
                - kosten
                - winst
                - btw_te_betalen
              scan_interval: 3600
          ```

          | Grootboek | Omschrijving |
          |---|---|
          | **8xxx** | Omzet (alle verkopen) |
          | **4xxx–7xxx** | Kosten (alle inkopen) |
          | **9000** | Brutowinst |
          | **9100** | Bedrijfsresultaat |
          | **1510/1511** | BTW afdracht hoog/laag |
          | **1520** | Voorbelasting BTW |

      - type: statistic
        entity: sensor.erp_omzet_maand
        name: Omzet deze maand
        stat_type: mean
        period:
          calendar:
            period: month

      - type: statistic
        entity: sensor.erp_kosten_maand
        name: Kosten deze maand
        stat_type: mean
        period:
          calendar:
            period: month

      - type: statistic
        entity: sensor.erp_openstaande_facturen
        name: Openstaande facturen
        stat_type: mean
        period:
          calendar:
            period: month
