    path: verkopen
    icon: mdi:file-document-outline
    cards:

      - type: markdown
        content: |
          ## 🧾 Nieuwe Factuur — Verkopen
          Vul de gegevens in en klik op **Factuur genereren**.

          | Grootboek | Omschrijving | BTW |
          |---|---|---|
          | **8000** | Omzet diensten | 21% |
          | **8010** | Omzet diensten | 9% |
          | **8020** | Omzet vrijgesteld | 0% |
          | **8100** | Omzet producten | 21% |
          | **1300** | Debiteuren (vordering op klant) | — |
          | **1510** | BTW-afdracht hoog (21%) | — |
          | **1511** | BTW-afdracht laag (9%) | — |

      - type: entities
        title: "👤 Klant & Project"
        entities:
