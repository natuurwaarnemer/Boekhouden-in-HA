title: Natuurwaarnemer ERP
views:

  # =========================================================
  # View 1: Facturen
  # =========================================================
  - title: "📄 Facturen"
    path: facturen
    icon: mdi:file-document-outline
    cards:

      - type: markdown
        content: |
          ## 🧾 Nieuwe Factuur — Natuurwaarnemer ERP
          Vul de gegevens in en klik op **Factuur genereren**.

      - type: entities
        title: Klant & Project
        entities:
          - entity: input_select.factuur_klant
            name: Klant
          - entity: input_text.factuur_project
            name: Project / Referentie

      - type: entities
        title: "Regel 1"
        entities:
          - entity: input_text.factuur_regel1_omschrijving
            name: Omschrijving
          - entity: input_number.factuur_regel1_aantal
            name: Aantal
          - entity: input_number.factuur_regel1_prijs
            name: Stukprijs (€)
          - entity: input_select.factuur_regel1_btw
            name: BTW %

      - type: entities
        title: "Regel 2"
        entities:
          - entity: input_text.factuur_regel2_omschrijving
            name: Omschrijving
          - entity: input_number.factuur_regel2_aantal
            name: Aantal
          - entity: input_number.factuur_regel2_prijs
            name: Stukprijs (€)
          - entity: input_select.factuur_regel2_btw
            name: BTW %

      - type: entities
        title: "Regel 3"
        entities:
          - entity: input_text.factuur_regel3_omschrijving
            name: Omschrijving
          - entity: input_number.factuur_regel3_aantal
            name: Aantal
          - entity: input_number.factuur_regel3_prijs
            name: Stukprijs (€)
          - entity: input_select.factuur_regel3_btw
            name: BTW %

      - type: entities
        title: Opmerkingen & Status
        entities:
          - entity: input_text.factuur_notities
            name: Notities
          - entity: input_text.factuur_status
            name: Status

      - type: button
        name: Factuur genereren
        icon: mdi:file-document-plus
        tap_action:
          action: toggle
        entity: input_button.factuur_genereer
        show_state: false

  # =========================================================
  # View 2: Kosten
  # =========================================================
  - title: "💸 Kosten"
    path: kosten
    icon: mdi:cash-minus
    cards:

      - type: markdown
        content: |
          ## 💸 Kostenregistratie
          Registreer een uitgave en klik op **Kosten opslaan**.

      - type: entities
        title: Kostendetails
        entities:
          - entity: input_text.kosten_leverancier
            name: Leverancier
          - entity: input_text.kosten_omschrijving
            name: Omschrijving
          - entity: input_number.kosten_bedrag
            name: Bedrag (excl. BTW)
          - entity: input_select.kosten_btw
            name: BTW %
          - entity: input_text.kosten_datum
            name: Datum (JJJJ-MM-DD)
          - entity: input_select.kosten_grootboek
            name: Grootboekrekening

      - type: entities
        title: Status
        entities:
          - entity: input_text.kosten_status
            name: Status

      - type: button
        name: Kosten opslaan
        icon: mdi:content-save
        tap_action:
          action: toggle
        entity: input_button.kosten_opslaan
        show_state: false

  # =========================================================
  # View 3: Overzicht
  # =========================================================
  - title: "📊 Overzicht"
    path: overzicht
    icon: mdi:chart-bar
    cards:

      - type: markdown
        content: |
          ## 📊 Financieel Overzicht — Natuurwaarnemer ERP

          Hier komen de rapportage-kaarten zodra de grootboekflow actief is.
          Gebruik de n8n `/grootboek-rapport?periode=JJJJ-MM` webhook voor live data.

          **Tip:** Voeg onderstaande `rest` sensor toe aan `configuration.yaml` om
          de n8n rapportage-webhook periodiek op te vragen:

          ```yaml
          sensor:
            - platform: rest
              name: erp_rapport
              resource: "http://n8n:5678/webhook/grootboek-rapport"
              params:
                periode: "{{ now().strftime('%Y-%m') }}"
              value_template: "{{ value_json.omzet }}"
              json_attributes:
                - omzet
                - kosten
                - winst
                - btw_te_betalen
              scan_interval: 3600
          ```

          Daarna zijn `sensor.erp_rapport` attributen beschikbaar voor de kaarten hieronder.

      - type: statistic
        entity: sensor.erp_omzet_maand
        name: Omzet deze maand
        stat_type: mean
        period:
          calendar:
            period: month

      - type: statistic
        entity: sensor.erp_kosten_maand
        name: Kosten deze maand
        stat_type: mean
        period:
          calendar:
            period: month

      - type: statistic
        entity: sensor.erp_openstaande_facturen
        name: Openstaande facturen
        stat_type: mean
        period:
          calendar:
            period: month
