# ---------------------------------------------------------
# Knoppen
# ---------------------------------------------------------
input_button:
  factuur_genereer:
    name: Factuur Genereren
    icon: mdi:file-document-plus

  kosten_opslaan:
    name: Kosten Opslaan
    icon: mdi:content-save
