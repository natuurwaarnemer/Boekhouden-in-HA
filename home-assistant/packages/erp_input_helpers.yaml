      - "4410 Kantoorkosten (21%)"
      - "4420 Reiskosten (0%/21%)"
      - "4430 Marketing en reclame (21%)"
      - "4440 Automatisering en software (21%)"
      - "4450 Verzekeringen (0%)"
      - "4460 Telefoon en internet (21%)"
      - "6100 Bankkosten (0%)"
      - "7000 Representatiekosten (21%)"
      - "7100 Abonnementen (21%)"
