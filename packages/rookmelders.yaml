# /config/packages/rookmelders.yaml
# Rookmelder systeem - Definitieve versie
# Versie: 9.0 FINAL - Visuele waarschuwingen (geen TTS onderbreking)

# ============================================
# TEMPLATE SENSORS & BINARY SENSORS
# ============================================
template:
  - binary_sensor:
      - name: "Rookalarm Actief"
        unique_id: rookalarm_actief
        device_class: smoke
        state: >
          {{ is_state('binary_sensor.heiman_smokesensor_ef_3_0_rook', 'on') or
            is_state('binary_sensor.heiman_smokesensor_ef_3_0_rook_2', 'on') or
            is_state('binary_sensor.heiman_smokesensor_ef_3_0_rook_3', 'on') or
            is_state('binary_sensor.heiman_smokesensor_ef_3_0_rook_4', 'on') }}

  - sensor:
      - name: "Rookalarm Algemeen Status"
        unique_id: rookalarm_algemeen_status
        state: >
          {% if is_state('binary_sensor.rookalarm_actief', 'on') %}
            BRAND!
          {% else %}
            SAFE
          {% endif %}
        icon: >
          {% if is_state('binary_sensor.rookalarm_actief', 'on') %}
            mdi:fire-alert
          {% else %}
            mdi:shield-check
          {% endif %}

      - name: "Rookmelder Woonkamer Status"
        unique_id: rookmelder_woonkamer_status
        state: >
          {% if is_state('binary_sensor.heiman_smokesensor_ef_3_0_rook', 'on') %}
            ROOK!
          {% elif is_state('binary_sensor.heiman_smokesensor_ef_3_0_rook', 'unavailable') %}
            OFFLINE
          {% else %}
            SAFE
          {% endif %}
        icon: >
          {% if is_state('binary_sensor.heiman_smokesensor_ef_3_0_rook', 'on') %}
            mdi:fire-alert
          {% else %}
            mdi:smoke-detector
          {% endif %}

      - name: "Rookmelder Hal Status"
        unique_id: rookmelder_hal_status
        state: >
          {% if is_state('binary_sensor.heiman_smokesensor_ef_3_0_rook_2', 'on') %}
            ROOK!
          {% elif is_state('binary_sensor.heiman_smokesensor_ef_3_0_rook_2', 'unavailable') %}
            OFFLINE
          {% else %}
            SAFE
          {% endif %}
        icon: >
          {% if is_state('binary_sensor.heiman_smokesensor_ef_3_0_rook_2', 'on') %}
            mdi:fire-alert
          {% else %}
            mdi:smoke-detector
          {% endif %}

      - name: "Rookmelder Overloop Status"
        unique_id: rookmelder_overloop_status
        state: >
          {% if is_state('binary_sensor.heiman_smokesensor_ef_3_0_rook_3', 'on') %}
            ROOK!
          {% elif is_state('binary_sensor.heiman_smokesensor_ef_3_0_rook_3', 'unavailable') %}
            OFFLINE
          {% else %}
            SAFE
          {% endif %}
        icon: >
          {% if is_state('binary_sensor.heiman_smokesensor_ef_3_0_rook_3', 'on') %}
            mdi:fire-alert
          {% else %}
            mdi:smoke-detector
          {% endif %}

      - name: "Rookmelder Hobbykamer Status"
        unique_id: rookmelder_hobbykamer_status
        state: >
          {% if is_state('binary_sensor.heiman_smokesensor_ef_3_0_rook_4', 'on') %}
            ROOK!
          {% elif is_state('binary_sensor.heiman_smokesensor_ef_3_0_rook_4', 'unavailable') %}
            OFFLINE
          {% else %}
            SAFE
          {% endif %}
        icon: >
          {% if is_state('binary_sensor.heiman_smokesensor_ef_3_0_rook_4', 'on') %}
            mdi:fire-alert
          {% else %}
            mdi:smoke-detector
          {% endif %}

      - name: "Rookmelders Actief"
        unique_id: rookmelders_actief
        state: >
          {{ [
            states('binary_sensor.heiman_smokesensor_ef_3_0_rook'),
            states('binary_sensor.heiman_smokesensor_ef_3_0_rook_2'),
            states('binary_sensor.heiman_smokesensor_ef_3_0_rook_3'),
            states('binary_sensor.heiman_smokesensor_ef_3_0_rook_4')
          ] | select('eq', 'on') | list | count }}
        icon: mdi:fire
        unit_of_measurement: "melders"

      - name: "Rookmelders Offline"
        unique_id: rookmelders_offline
        state: >
          {{ [
            states('binary_sensor.heiman_smokesensor_ef_3_0_rook'),
            states('binary_sensor.heiman_smokesensor_ef_3_0_rook_2'),
            states('binary_sensor.heiman_smokesensor_ef_3_0_rook_3'),
            states('binary_sensor.heiman_smokesensor_ef_3_0_rook_4')
          ] | select('eq', 'unavailable') | list | count }}
        icon: mdi:smoke-detector-alert
        unit_of_measurement: "melders"

      - name: "Rookmelders Lage Batterij"
        unique_id: rookmelders_lage_batterij
        state: >
          {{ [
            states('sensor.heiman_smokesensor_ef_3_0_batterij') | int(100),
            states('sensor.heiman_smokesensor_ef_3_0_batterij_2') | int(100),
            states('sensor.heiman_smokesensor_ef_3_0_batterij_3') | int(100),
            states('sensor.heiman_smokesensor_ef_3_0_batterij_4') | int(100)
          ] | select('lt', 20) | list | count }}
        icon: mdi:battery-alert
        unit_of_measurement: "melders"

# ============================================
# INPUT BOOLEANS
# ============================================
input_boolean:
  test_rookmelder_systeem:
    name: Test Rookmelder Systeem
    icon: mdi:fire-alert

# ============================================
# SCRIPTS
# ============================================
script:
  rookalarm_volledig:
    alias: "Rookalarm Volledig Systeem"
    description: "Triple visuele waarschuwing zonder TV te onderbreken"
    mode: restart
    fields:
      locatie:
        description: "Locatie van het alarm"
        example: "Woonkamer"
    sequence:
      # ===== WAARSCHUWING 1 - GROOT EN DUIDELIJK =====
      
      - service: notify.android_tv_fire_tv
        data:
          title: "🔥🔥🔥 ROOKALARM 🔥🔥🔥"
          message: "ROOK GEDETECTEERD: {{ locatie | upper }}\n\n⚠️ VERLAAT ONMIDDELLIJK HET PAND ⚠️"
          data:
            duration: 0  # Blijft staan tot je het wegklikt
            fontsize: max
            position: center
            color: red
            transparency: opaque
            interrupt: 1
      
      # ===== WAARSCHUWING 2 - NA 8 SECONDEN =====
      
      - delay: 8
      
      - service: notify.android_tv_fire_tv
        data:
          title: "🔥🔥🔥 ROOKALARM 🔥🔥🔥"
          message: "{{ locatie | upper }}\n\n⚠️ VERLAAT HET PAND NU! ⚠️"
          data:
            duration: 0
            fontsize: max
            position: center
            color: red
            transparency: opaque
            interrupt: 1
      
      # ===== WAARSCHUWING 3 - NA NOGMAALS 8 SECONDEN =====
      
      - delay: 8
      
      - service: notify.android_tv_fire_tv
        data:
          title: "🔥 ROOKALARM - {{ locatie | upper }} 🔥"
          message: "⚠️ VERLAAT HET PAND ONMIDDELLIJK ⚠️"
          data:
            duration: 0
            fontsize: max
            position: center
            color: red
            transparency: opaque
            interrupt: 1
      

# ============================================
# AUTOMATISERINGEN - ROOKMELDERS
# ============================================
automation:
  # ===== WOONKAMER =====
  
  - id: rookmelder_woonkamer_alarm
    alias: "🔥 Rookmelder Woonkamer"
    description: "Rookalarm woonkamer met triple visuele waarschuwing"
    trigger:
      - platform: state
        entity_id: binary_sensor.heiman_smokesensor_ef_3_0_rook
        to: "on"
    action:
      - service: script.rookalarm_volledig
        data:
          locatie: "Woonkamer"
      
      - service: notify.persistent_notification
        data:
          title: "🔥 ROOKALARM - WOONKAMER"
          message: "ROOK GEDETECTEERD! {{ now().strftime('%H:%M:%S') }}"

  # ===== HAL =====
  
  - id: rookmelder_hal_alarm
    alias: "🔥 Rookmelder Hal"
    description: "Rookalarm hal met triple visuele waarschuwing"
    trigger:
      - platform: state
        entity_id: binary_sensor.heiman_smokesensor_ef_3_0_rook_2
        to: "on"
    action:
      - service: script.rookalarm_volledig
        data:
          locatie: "Hal"
      
      - service: notify.persistent_notification
        data:
          title: "🔥 ROOKALARM - HAL"
          message: "ROOK GEDETECTEERD! {{ now().strftime('%H:%M:%S') }}"

  # ===== OVERLOOP =====
  
  - id: rookmelder_overloop_alarm
    alias: "🔥 Rookmelder Overloop"
    description: "Rookalarm overloop met triple visuele waarschuwing"
    trigger:
      - platform: state
        entity_id: binary_sensor.heiman_smokesensor_ef_3_0_rook_3
        to: "on"
    action:
      - service: script.rookalarm_volledig
        data:
          locatie: "Overloop"
      
      - service: notify.persistent_notification
        data:
          title: "🔥 ROOKALARM - OVERLOOP"
          message: "ROOK GEDETECTEERD! {{ now().strftime('%H:%M:%S') }}"

  # ===== HOBBYKAMER =====
  
  - id: rookmelder_hobbykamer_alarm
    alias: "🔥 Rookmelder Hobbykamer"
    description: "Rookalarm hobbykamer met triple visuele waarschuwing"
    trigger:
      - platform: state
        entity_id: binary_sensor.heiman_smokesensor_ef_3_0_rook_4
        to: "on"
    action:
      - service: script.rookalarm_volledig
        data:
          locatie: "Hobbykamer"
      
      - service: notify.persistent_notification
        data:
          title: "🔥 ROOKALARM - HOBBYKAMER"
          message: "ROOK GEDETECTEERD! {{ now().strftime('%H:%M:%S') }}"

  # ===== LAGE BATTERIJ WAARSCHUWINGEN =====
  
  - id: rookmelder_woonkamer_batterij
    alias: "🔋 Rookmelder Woonkamer - Lage Batterij"
    trigger:
      - platform: numeric_state
        entity_id: sensor.heiman_smokesensor_ef_3_0_batterij
        below: 20
    action:
      - service: notify.persistent_notification
        data:
          title: "🔋 Rookmelder Woonkamer"
          message: "Batterij {{ states('sensor.heiman_smokesensor_ef_3_0_batterij') }}%. Vervang!"
      
      - service: notify.android_tv_fire_tv
        data:
          title: "🔋 Rookmelder Batterij Laag"
          message: "Woonkamer: {{ states('sensor.heiman_smokesensor_ef_3_0_batterij') }}%"
          data:
            duration: 10
            fontsize: large
            position: bottom-right
            color: orange

  - id: rookmelder_hal_batterij
    alias: "🔋 Rookmelder Hal - Lage Batterij"
    trigger:
      - platform: numeric_state
        entity_id: sensor.heiman_smokesensor_ef_3_0_batterij_2
        below: 20
    action:
      - service: notify.persistent_notification
        data:
          title: "🔋 Rookmelder Hal"
          message: "Batterij {{ states('sensor.heiman_smokesensor_ef_3_0_batterij_2') }}%. Vervang!"
      
      - service: notify.android_tv_fire_tv
        data:
          title: "🔋 Rookmelder Batterij Laag"
          message: "Hal: {{ states('sensor.heiman_smokesensor_ef_3_0_batterij_2') }}%"
          data:
            duration: 10
            fontsize: large
            position: bottom-right
            color: orange

  - id: rookmelder_overloop_batterij
    alias: "🔋 Rookmelder Overloop - Lage Batterij"
    trigger:
      - platform: numeric_state
        entity_id: sensor.heiman_smokesensor_ef_3_0_batterij_3
        below: 20
    action:
      - service: notify.persistent_notification
        data:
          title: "🔋 Rookmelder Overloop"
          message: "Batterij {{ states('sensor.heiman_smokesensor_ef_3_0_batterij_3') }}%. Vervang!"
      
      - service: notify.android_tv_fire_tv
        data:
          title: "🔋 Rookmelder Batterij Laag"
          message: "Overloop: {{ states('sensor.heiman_smokesensor_ef_3_0_batterij_3') }}%"
          data:
            duration: 10
            fontsize: large
            position: bottom-right
            color: orange

  - id: rookmelder_hobbykamer_batterij
    alias: "🔋 Rookmelder Hobbykamer - Lage Batterij"
    trigger:
      - platform: numeric_state
        entity_id: sensor.heiman_smokesensor_ef_3_0_batterij_4
        below: 20
    action:
      - service: notify.persistent_notification
        data:
          title: "🔋 Rookmelder Hobbykamer"
          message: "Batterij {{ states('sensor.heiman_smokesensor_ef_3_0_batterij_4') }}%. Vervang!"
      
      - service: notify.android_tv_fire_tv
        data:
          title: "🔋 Rookmelder Batterij Laag"
          message: "Hobbykamer: {{ states('sensor.heiman_smokesensor_ef_3_0_batterij_4') }}%"
          data:
            duration: 10
            fontsize: large
            position: bottom-right
            color: orange

  # ===== OFFLINE DETECTIE =====
  
  - id: rookmelder_woonkamer_offline
    alias: "⚠️ Rookmelder Woonkamer - Offline"
    trigger:
      - platform: state
        entity_id: binary_sensor.heiman_smokesensor_ef_3_0_rook
        to: "unavailable"
        for:
          minutes: 30
    action:
      - service: notify.persistent_notification
        data:
          title: "⚠️ Rookmelder Woonkamer Offline"
          message: "Sinds {{ now().strftime('%H:%M') }}. Check batterij!"

  - id: rookmelder_hal_offline
    alias: "⚠️ Rookmelder Hal - Offline"
    trigger:
      - platform: state
        entity_id: binary_sensor.heiman_smokesensor_ef_3_0_rook_2
        to: "unavailable"
        for:
          minutes: 30
    action:
      - service: notify.persistent_notification
        data:
          title: "⚠️ Rookmelder Hal Offline"
          message: "Sinds {{ now().strftime('%H:%M') }}. Check batterij!"

  - id: rookmelder_overloop_offline
    alias: "⚠️ Rookmelder Overloop - Offline"
    trigger:
      - platform: state
        entity_id: binary_sensor.heiman_smokesensor_ef_3_0_rook_3
        to: "unavailable"
        for:
          minutes: 30
    action:
      - service: notify.persistent_notification
        data:
          title: "⚠️ Rookmelder Overloop Offline"
          message: "Sinds {{ now().strftime('%H:%M') }}. Check batterij!"

  - id: rookmelder_hobbykamer_offline
    alias: "⚠️ Rookmelder Hobbykamer - Offline"
    trigger:
      - platform: state
        entity_id: binary_sensor.heiman_smokesensor_ef_3_0_rook_4
        to: "unavailable"
        for:
          minutes: 30
    action:
      - service: notify.persistent_notification
        data:
          title: "⚠️ Rookmelder Hobbykamer Offline"
          message: "Sinds {{ now().strftime('%H:%M') }}. Check batterij!"

  # ===== TEST AUTOMATISERING =====
  
  - id: test_rookmelder_systeem
    alias: "🧪 Test Rookmelder Systeem"
    description: "Test visuele alarmen (3x herhalen)"
    trigger:
      - platform: state
        entity_id: input_boolean.test_rookmelder_systeem
        to: "on"
    action:
      # Test notificatie 1
      - service: notify.android_tv_fire_tv
        data:
          title: "🔥 TEST ALARM - 1/3"
          message: "Dit is test 1!\n\nAls je dit ziet werkt het systeem ✅"
          data:
            duration: 8
            fontsize: max
            position: center
            color: orange
            transparency: opaque
            interrupt: 1
      
      # Wacht 8 seconden
      - delay: 8
      
      # Test notificatie 2
      - service: notify.android_tv_fire_tv
        data:
          title: "🔥 TEST ALARM - 2/3"
          message: "Dit is test 2!\n\nWaarschuwing wordt herhaald ✅"
          data:
            duration: 8
            fontsize: max
            position: center
            color: orange
            transparency: opaque
            interrupt: 1
      
      # Wacht 8 seconden
      - delay: 8
      
      # Test notificatie 3
      - service: notify.android_tv_fire_tv
        data:
          title: "🔥 TEST ALARM - 3/3"
          message: "Dit is test 3!\n\nTriple alarm systeem werkt! ✅"
          data:
            duration: 8
            fontsize: max
            position: center
            color: orange
            transparency: opaque
            interrupt: 1
      
      # Schakel test uit
      - delay: 2
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.test_rookmelder_systeem