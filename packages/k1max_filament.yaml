# k1max_filament.yaml — v14
# Wijzigingen t.o.v. v13:
#   FIX A  : actieve spool blijft bewaard na HA-update/herstart
#            (opgeslagen in input_text.k1max_spool_active_persist, hersteld via startup-automation)
#   FIX B  : notify.k1max_log werkt als je configuration.yaml correct is (zie README-opmerking onderaan)
#             + dubbele aftrek van remaining_g opgelost: als live-update draaide, trekt finalize NIET nogmaals af
#   FEATURE: k1max_weight_calibration_g — vaste correctie (g) per print voor purge/opstartafval
#             Standaard 3 g (typisch voor K1 Max cold-start purgelijn)
#             Wordt ALLEEN toegepast op kostenberekening (used_g_net), NIET op fysiek spool-gewicht
#
# HELPERS DIE VIA DE UI AANGEMAAKT MOETEN WORDEN (Settings → Helpers):
#   per filament-bibliotheekitem (X = 1..11):
#     input_number.k1max_filament_X_weight_g
#     input_number.k1max_filament_X_cost_eur
#     input_number.k1max_filament_X_diameter_mm
#     input_number.k1max_filament_X_density_g_cm3
#   per spool (X = 1..11):
#     input_select.k1max_spoolX_filament    (opties: filament_1..filament_11 + 'none')
#     input_number.k1max_spoolX_capacity_g
#     input_number.k1max_spoolX_remaining_g
#     input_number.k1max_spoolX_last_used_g
#     input_text.k1max_spoolX_name
#     input_text.k1max_spoolX_brand
#   globaal:
#     input_number.k1max_energy_cost_per_hour
#     input_number.k1max_labor_cost_per_hour
#     input_number.k1max_handling_cost_per_print
#     input_datetime.k1max_last_print_start
#     input_number.k1max_last_print_minutes
#     input_text.k1max_last_print_report
#     input_number.k1max_filament_diameter_mm     (fallback als spool geen filament gekoppeld heeft)
#     input_number.k1max_filament_density_g_cm3   (fallback)
#
# CONFIGURATION.YAML vereist:
#   notify:
#     - name: k1max_log
#       platform: file
#       filename: /config/k1max_print_log.txt
#       timestamp: false
#   shell_command:
#     k1max_purge_log: 'bash -c "truncate -s 0 /config/k1max_print_log.txt"'
#     k1max_export_log: 'bash -c "mkdir -p /config/www && cp /config/k1max_print_log.txt /config/www/{{ filename }}"'

