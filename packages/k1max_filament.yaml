########################
# scripts
########################
script:
  k1max_mark_active_full:
    alias: "k1max: mark active spool full"
    sequence:
      - service: input_number.set_value
        data:
          entity_id: "{{ 'input_number.k1max_' ~ states('input_select.k1max_spool_active') ~ '_remaining_g' }}"
          value: "{{ states('input_number.k1max_' ~ states('input_select.k1max_spool_active') ~ '_capacity_g') }}"
      - service: input_number.set_value
        data:
          entity_id: "{{ 'input_number.k1max_' ~ states('input_select.k1max_spool_active') ~ '_last_handled_length_cm' }}"
          value: "{{ states('sensor.k1max_6f16_used_material_length') | float(0) }}"
      - service: input_number.set_value
        data:
          entity_id: "{{ 'input_number.k1max_' ~ states('input_select.k1max_spool_active') ~ '_last_used_g' }}"
          value: 0
      - service: persistent_notification.create
        data:
          title: "k1max: mark active full"
          message: >-
            Active spool {{ states('input_select.k1max_spool_active') }} marked as full and last_used reset.

  k1max_set_current_length_as_last_handled:
    alias: "k1max: set last handled length to current (and clear last_used for active spool)"
    sequence:
      - service: input_number.set_value
        data:
          entity_id: >-
            input_number.k1max_{{ states('input_select.k1max_spool_active') }}_last_handled_length_cm
          value: "{{ states('sensor.k1max_6f16_used_material_length') | float(0) }}"
      - service: input_number.set_value
        data:
          entity_id: >-
            input_number.k1max_{{ states('input_select.k1max_spool_active') }}_last_used_g
          value: 0
      - service: persistent_notification.create
        data:
          title: "k1max: baseline & last_used gereset"
          message: >-
            Baseline en last_used gereset voor {{ states('input_select.k1max_spool_active') }} (length = {{ states('sensor.k1max_6f16_used_material_length') }} cm).

  k1max_fix_active_baseline:
    alias: "k1max: fix active spool baseline (compute used & remaining from current length)"
    sequence:
      - variables:
          active: "{{ states('input_select.k1max_spool_active') }}"
          cur_length_cm: "{{ states('sensor.k1max_6f16_used_material_length') | float(0) }}"
          prev_length_cm: "{{ states('input_number.k1max_' ~ active ~ '_last_handled_length_cm') | float(0) }}"
          used_cm: "{{ (cur_length_cm - prev_length_cm) if (cur_length_cm - prev_length_cm) > 0 else 0 }}"
          idx: "{{ active.replace('spool','') }}"
          sel: "{{ states('input_select.k1max_spool' ~ idx ~ '_filament') }}"
          filament_diameter_mm: >-
            {% if sel != 'none' %}
              {{ states('input_number.k1max_' ~ sel ~ '_diameter_mm') | float(0) }}
            {% else %}
              {{ states('input_number.k1max_filament_diameter_mm') | float(0) }}
            {% endif %}
          filament_density_g_cm3: >-
            {% if sel != 'none' %}
              {{ states('input_number.k1max_' ~ sel ~ '_density_g_cm3') | float(0) }}
            {% else %}
              {{ states('input_number.k1max_filament_density_g_cm3') | float(0) }}
            {% endif %}
          used_g: >-
            {% set dia_cm = (filament_diameter_mm | float(0)) / 10.0 %}
            {% set radius_cm = (dia_cm / 2.0) %}
            {{ (used_cm * 3.141592653589793 * (radius_cm ** 2) * (filament_density_g_cm3 | float(0))) | round(2) }}
          current_remaining: "{{ states('input_number.k1max_' ~ active ~ '_remaining_g') | float(0) }}"
          new_remaining: "{{ (current_remaining - (used_g | float(0))) | round(2) }}"
      - service: input_number.set_value
        data:
          entity_id: "{{ 'input_number.k1max_' ~ active ~ '_last_handled_length_cm' }}"
          value: "{{ cur_length_cm }}"
      - service: input_number.set_value
        data:
          entity_id: "{{ 'input_number.k1max_' ~ active ~ '_last_used_g' }}"
          value: "{{ used_g }}"
      - service: input_number.set_value
        data:
          entity_id: "{{ 'input_number.k1max_' ~ active ~ '_remaining_g' }}"
          value: "{{ new_remaining if new_remaining >= 0 else 0 }}"
      - service: persistent_notification.create
        data:
          title: "k1max: baseline fixed"
          message: >-
            Active {{ active }} baseline gezet op length {{ cur_length_cm }} cm, last_used = {{ used_g }} g, remaining = {{ new_remaining }} g.

  k1max_purge_print_log:
    alias: "k1max: purge print log"
    sequence:
      - service: shell_command.k1max_purge_log
      - service: persistent_notification.create
        data:
          title: "k1max: print log gewist"
          message: "Het bestand /config/k1max_print_log.txt is nu leeggemaakt."

  k1max_export_print_log:
    alias: "k1max: export print log to www"
    sequence:
      - variables:
          ts: "{{ now().strftime('%Y%m%d_%H%M%S') }}"
          fname: "{{ 'k1max_print_log_' ~ ts ~ '.txt' }}"
      - service: shell_command.k1max_export_log
        data:
          filename: "{{ fname }}"
      - delay: "00:00:01"
      - service: persistent_notification.create
        data:
          title: "k1max: print log geëxporteerd"
          message: >-
            Log gekopieerd naar: /config/www/{{ fname }}
            (Toegang via: /local/{{ fname }})

########################
# automations
########################
automation:
  # -------------------------------------------------------
  - id: "k1max_save_active_spool_on_change"
    alias: "k1max: sla actieve spool op bij wijziging"
    mode: single
    trigger:
      - platform: state
        entity_id: input_select.k1max_spool_active
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state not in ['unknown','unavailable',''] }}"
    action:
      - service: input_text.set_value
        data:
          entity_id: input_text.k1max_spool_active_persist
          value: "{{ trigger.to_state.state }}"

  - id: "k1max_restore_active_spool_on_startup"
    alias: "k1max: herstel actieve spool na herstart"
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    action:
      - delay: "00:00:08"
      - variables:
          saved: "{{ states('input_text.k1max_spool_active_persist') }}"
      - choose:
          - conditions:
              - "{{ saved not in ['unknown','unavailable',''] }}"
            sequence:
              - service: input_select.select_option
                data:
                  entity_id: input_select.k1max_spool_active
                  option: "{{ saved }}"
        default: []

  - id: "k1max_update_current_project_name"
    alias: "k1max: update current project name"
    trigger:
    - platform: state
      entity_id: sensor.k1max_6f16_current_object
    action:
    - service: input_text.set_value
      target:
        entity_id: input_text.k1max_current_project
      data:
        value: >-
          {% set raw = states('sensor.k1max_6f16_current_object') %}
          {{ raw.split('.STL')[0] | replace('_', ' ') | title }}

  # -------------------------------------------------------
  # print start: baseline + starttijd vastleggen
  # -------------------------------------------------------
  - id: "k1max_record_on_print_start"
    alias: "k1max: record start length on print start (robust)"
    description: "Zet baseline, last_used=0 en record starttijd zodra print begint"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.k1max_6f16_print_status
        to: "printing"
    condition:
      - condition: template
        value_template: "{{ 'printing' in (trigger.to_state.state | lower) and 'self' not in (trigger.to_state.state | lower) }}"
    action:
      - variables:
          active: "{{ states('input_select.k1max_spool_active') }}"
          cur_length_cm: "{{ states('sensor.k1max_6f16_used_material_length') | float(0) }}"
      - service: input_number.set_value
        data:
          entity_id: "{{ 'input_number.k1max_' ~ active ~ '_last_handled_length_cm' }}"
          value: "{{ cur_length_cm }}"
      - service: input_number.set_value
        data:
          entity_id: "{{ 'input_number.k1max_' ~ active ~ '_last_used_g' }}"
          value: 0
      - service: input_datetime.set_datetime
        data:
          entity_id: input_datetime.k1max_last_print_start
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - service: persistent_notification.create
        data:
          title: "k1max: print gestart"
          message: >-
            Baseline gezet voor {{ active }} (length = {{ cur_length_cm }} cm). Starttijd vastgelegd.

  # -------------------------------------------------------
  # live update tijdens printen
  # -------------------------------------------------------
  - id: "k1max_live_update_used_length"
    alias: "k1max: live update last_used during printing"
    description: "Realtime update last_used_g and remaining_g while print is running"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.k1max_6f16_used_material_length
    condition:
      - condition: template
        value_template: "{{ 'printing' in (states('sensor.k1max_6f16_print_status') | lower) and 'self' not in (states('sensor.k1max_6f16_print_status') | lower) }}"
    action:
      - variables:
          active: "{{ states('input_select.k1max_spool_active') }}"
          cur_length_cm: "{{ trigger.to_state.state | float(0) }}"
          prev_length_cm: "{{ states('input_number.k1max_' ~ active ~ '_last_handled_length_cm') | float(0) }}"
          used_cm_increment: "{{ (cur_length_cm - prev_length_cm) if (cur_length_cm - prev_length_cm) > 0 else 0 }}"
          idx: "{{ active.replace('spool','') }}"
          sel: "{{ states('input_select.k1max_spool' ~ idx ~ '_filament') }}"
          filament_diameter_mm: >-
            {% if sel != 'none' %}
              {{ states('input_number.k1max_' ~ sel ~ '_diameter_mm') | float(0) }}
            {% else %}
              {{ states('input_number.k1max_filament_diameter_mm') | float(0) }}
            {% endif %}
          filament_density_g_cm3: >-
            {% if sel != 'none' %}
              {{ states('input_number.k1max_' ~ sel ~ '_density_g_cm3') | float(0) }}
            {% else %}
              {{ states('input_number.k1max_filament_density_g_cm3') | float(0) }}
            {% endif %}
          used_g_increment: >-
            {% set dia_cm = (filament_diameter_mm | float(0)) / 10.0 %}
            {% set radius_cm = dia_cm / 2.0 %}
            {{ (used_cm_increment * 3.141592653589793 * (radius_cm ** 2) * (filament_density_g_cm3 | float(0))) | round(3) }}
          current_last_used: "{{ states('input_number.k1max_' ~ active ~ '_last_used_g') | float(0) }}"
          new_last_used: "{{ (current_last_used + used_g_increment) | round(2) }}"
          new_remaining: "{{ (states('input_number.k1max_' ~ active ~ '_remaining_g') | float(0) - used_g_increment) | round(2) }}"
      - choose:
          - conditions:
              - "{{ used_g_increment >= 0.01 }}"
            sequence:
              - service: input_number.set_value
                data:
                  entity_id: "{{ 'input_number.k1max_' ~ active ~ '_last_used_g' }}"
                  value: "{{ new_last_used }}"
              - service: input_number.set_value
                data:
                  entity_id: "{{ 'input_number.k1max_' ~ active ~ '_remaining_g' }}"
                  value: "{{ new_remaining if new_remaining >= 0 else 0 }}"
              - service: input_number.set_value
                data:
                  entity_id: "{{ 'input_number.k1max_' ~ active ~ '_last_handled_length_cm' }}"
                  value: "{{ cur_length_cm }}"
        default: []

  # -------------------------------------------------------
  # print einde: rapport + log + opruimen
  # -------------------------------------------------------
  - id: "k1max_finalize_on_print_end"
    alias: "k1max: finalize spool usage on print end"
    description: "Rapport schrijven, logfile bijwerken, remaining updaten, baseline resetten"
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.k1max_6f16_print_status
        to: "completed"
      - platform: state
        entity_id: sensor.k1max_6f16_print_status
        to: "stopped"
      - platform: state
        entity_id: sensor.k1max_6f16_print_status
        to: "error"
    condition: []
    action:
      - variables:
          active: "{{ states('input_select.k1max_spool_active') }}"
          cur_length_cm: "{{ states('sensor.k1max_6f16_used_material_length') | float(0) }}"
          prev_length_cm: "{{ states('input_number.k1max_' ~ active ~ '_last_handled_length_cm') | float(0) }}"
          used_cm: "{{ (cur_length_cm - prev_length_cm) if (cur_length_cm - prev_length_cm) > 0 else 0 }}"
          idx: "{{ active.replace('spool','') }}"
          sel: "{{ states('input_select.k1max_spool' ~ idx ~ '_filament') }}"
          filament_diameter_mm: >-
            {% if sel != 'none' %}
              {{ states('input_number.k1max_' ~ sel ~ '_diameter_mm') | float(0) }}
            {% else %}
              {{ states('input_number.k1max_filament_diameter_mm') | float(0) }}
            {% endif %}
          filament_density_g_cm3: >-
            {% if sel != 'none' %}
              {{ states('input_number.k1max_' ~ sel ~ '_density_g_cm3') | float(0) }}
            {% else %}
              {{ states('input_number.k1max_filament_density_g_cm3') | float(0) }}
            {% endif %}
          used_g_by_lengths: >-
            {% set dia_cm = (filament_diameter_mm | float(0)) / 10.0 %}
            {% set radius_cm = dia_cm / 2.0 %}
            {{ (used_cm * 3.141592653589793 * (radius_cm ** 2) * (filament_density_g_cm3 | float(0))) | round(3) }}
          session_last_used: "{{ states('input_number.k1max_' ~ active ~ '_last_used_g') | float(0) }}"
          used_g_total: >-
            {% if session_last_used > 0 %}{{ session_last_used }}
            {% else %}{{ used_g_by_lengths }}{% endif %}
          calibration_g: "{{ states('input_number.k1max_weight_calibration_g') | float(0) }}"
          used_g_net: >-
            {{ ((used_g_total | float(0)) + calibration_g) | round(3) }}
          current_remaining: "{{ states('input_number.k1max_' ~ active ~ '_remaining_g') | float(0) }}"
          cpg: "{{ states('sensor.k1max_active_cost_per_gram') | float(0) }}"
          minutes: "{{ states('sensor.k1max_active_elapsed_minutes') | float(0) }}"
          energy_cost: "{{ ((states('input_number.k1max_energy_cost_per_hour') | float(0) / 60.0) * minutes) | round(2) }}"
          labor_cost: "{{ ((states('input_number.k1max_labor_cost_per_hour') | float(0) / 60.0) * minutes) | round(2) }}"
          handling_cost: "{{ states('input_number.k1max_handling_cost_per_print') | float(0) | round(2) }}"
          material_cost: "{{ (used_g_net * cpg) | round(2) }}"
          total_cost: "{{ (material_cost + energy_cost + labor_cost + handling_cost) | round(2) }}"
          # remaining: live-update heeft al afgetrokken, dus NIET nogmaals aftrekken
          # we zetten remaining alleen op 0-minimum als het negatief is
          new_remaining: "{{ [current_remaining, 0] | max }}"
          now_str: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      - choose:
          - conditions:
              - "{{ used_g_total | float(0) > 0 }}"
            sequence:
              - service: input_text.set_value
                data:
                  entity_id: input_text.k1max_last_print_report
                  value: >-
                    Print rapport — {{ now_str }}
                    Spool: {{ active }}
                    Filament: {{ sel }}
                    Gebruikte lengte (cm): {{ used_cm | round(1) }}
                    Bruto gewicht (g): {{ used_g_total }}
                    Kalibratie correctie (g): -{{ calibration_g }}
                    Netto gewicht (g): {{ used_g_net }}
                    Materiaalkosten (EUR): {{ material_cost }}
                    Energie (EUR): {{ energy_cost }}
                    Arbeid (EUR): {{ labor_cost }}
                    Handling (EUR): {{ handling_cost }}
                    Totaal kosten (EUR): {{ total_cost }}
              - service: persistent_notification.create
                data:
                  title: "k1max: print afgerond — rapport"
                  message: "{{ states('input_text.k1max_last_print_report') }}"
              - service: shell_command.k1max_write_log
                data:
                  message: >-
                    ╔══════════════════════════════════════╗
                    ║  🖨️  K1 Max Print Rapport             ║
                    ╠══════════════════════════════════════╣
                    ║  📋 Project  : {{ states('input_text.k1max_current_project') }}
                    ║  🎨 Filament : {{ states('input_text.k1max_filament_' ~ sel ~ '_name') }} {{ states('input_text.k1max_filament_' ~ sel ~ '_brand') }}
                    ║  ⚖️  Bruto   : {{ used_g_total }} g
                    ║  ⚖️  Netto   : {{ used_g_net }} g
                    ║  💰 Materiaal: €{{ material_cost }}
                    ║  ⚡ Energie  : €{{ energy_cost }}
                    ║  👷 Arbeid   : €{{ labor_cost }}
                    ║  📦 Handling : €{{ handling_cost }}
                    ║  💶 Totaal   : €{{ total_cost }}
                    ║  🕐 Datum    : {{ now_str }}
                    ╚══════════════════════════════════════╝
              - service: input_number.set_value
                data:
                  entity_id: "{{ 'input_number.k1max_' ~ active ~ '_last_used_g' }}"
                  value: 0
              - service: input_number.set_value
                data:
                  entity_id: "{{ 'input_number.k1max_' ~ active ~ '_last_handled_length_cm' }}"
                  value: "{{ cur_length_cm }}"
        default: []

  # -------------------------------------------------------
  # startup guard
  # -------------------------------------------------------
  - id: "k1max_ensure_baseline_when_printing_on_startup"
    alias: "k1max: ensure baseline if printing and baseline missing"
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    condition: []
    action:
      - delay: "00:00:10"
      - variables:
          active: "{{ states('input_select.k1max_spool_active') }}"
          status: "{{ states('sensor.k1max_6f16_print_status') }}"
          prev_length: "{{ states('input_number.k1max_' ~ active ~ '_last_handled_length_cm') | float(0) }}"
      - choose:
          - conditions:
              - "{{ 'printing' in (status | lower) and 'self' not in (status | lower) }}"
              - "{{ prev_length <= 0 }}"
            sequence:
              - service: script.k1max_fix_active_baseline
        default: []