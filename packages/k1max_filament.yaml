          {% if cap > 0 %}{{ ((rem / cap) * 100) | round(1) }}{% else %}0{% endif %}
        unit_of_measurement: "%"
        attributes:
          remaining_g: "{{ states('input_number.k1max_spool11_remaining_g') }}"
          capacity_g: "{{ states('input_number.k1max_spool11_capacity_g') }}"

      - name: "k1max active spool remaining percent"
        unique_id: "k1max_active_spool_remaining_percent"
        state: >-
          {% set active = states('input_select.k1max_spool_active') %}
          {% set rem = states('input_number.k1max_' ~ active ~ '_remaining_g') | float(0) %}
          {% set cap = states('input_number.k1max_' ~ active ~ '_capacity_g') | float(0) %}
          {% if cap > 0 %}{{ ((rem / cap) * 100) | round(1) }}{% else %}0{% endif %}
        unit_of_measurement: "%"
        attributes:
          active_spool: "{{ states('input_select.k1max_spool_active') }}"
          remaining_g: "{{ states('input_number.k1max_' ~ states('input_select.k1max_spool_active') ~ '_remaining_g') }}"
          capacity_g: "{{ states('input_number.k1max_' ~ states('input_select.k1max_spool_active') ~ '_capacity_g') }}"

      - name: "k1max active elapsed minutes"
        unique_id: "k1max_active_elapsed_minutes"
        state: >-
          {% set status = states('sensor.k1max_6f16_print_status') %}
          {% set start = states('input_datetime.k1max_last_print_start') %}
          {% set fallback = states('input_number.k1max_last_print_minutes') | float(0) %}
          {% if status == 'printing' and start not in ['unknown','unavailable',''] %}
            {% set diff_s = (as_timestamp(now()) - as_timestamp(start)) %}
            {% if diff_s > 0 and diff_s <= 6*3600 %}
              {{ (diff_s / 60) | round(1) }}
            {% else %}
              {{ fallback }}
            {% endif %}
          {% else %}
            {{ fallback }}
          {% endif %}
        unit_of_measurement: "min"
        attributes:
          print_status: "{{ states('sensor.k1max_6f16_print_status') }}"
          start_time: "{{ states('input_datetime.k1max_last_print_start') }}"

      - name: "k1max active cost per gram"
        unique_id: "k1max_active_cost_per_gram"
        state: >-
          {% set active = states('input_select.k1max_spool_active') %}
          {% set sel = states('input_select.k1max_' ~ active ~ '_filament') %}
          {% if sel not in ['','none','unknown'] and
                (states('input_number.k1max_' ~ sel ~ '_cost_eur') not in ['unknown','unavailable','']) and
                (states('input_number.k1max_' ~ sel ~ '_weight_g') not in ['unknown','unavailable','']) %}
            {% set cost = states('input_number.k1max_' ~ sel ~ '_cost_eur') | float(0) %}
            {% set weight = states('input_number.k1max_' ~ sel ~ '_weight_g') | float(0) %}
            {% if weight > 0 %}{{ (cost / weight) | round(6) }}{% else %}0{% endif %}
          {% elif states('input_number.k1max_filament_cost_per_g') not in ['unknown','unavailable',''] %}
            {{ states('input_number.k1max_filament_cost_per_g') | float(0) | round(6) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "EUR/g"

      - name: "k1max active material cost"
        unique_id: "k1max_active_material_cost"
        state: >-
          {% set active = states('input_select.k1max_spool_active') %}
          {% set used = states('input_number.k1max_' ~ active ~ '_last_used_g') | float(0) %}
          {% set cpg = states('sensor.k1max_active_cost_per_gram') | float(0) %}
          {% set cal = states('input_number.k1max_weight_calibration_g') | float(0) %}
          {% set used_net = used + cal %}
          {{ (used_net * cpg) | round(2) }}
        unit_of_measurement: "EUR"
        attributes:
          used_g_raw: "{{ states('input_number.k1max_' ~ states('input_select.k1max_spool_active') ~ '_last_used_g') }}"
          calibration_g: "{{ states('input_number.k1max_weight_calibration_g') }}"
          cost_per_g: "{{ states('sensor.k1max_active_cost_per_gram') }}"

      - name: "k1max active energy cost"
        unique_id: "k1max_active_energy_cost"
        state: >-
          {% set minutes = states('sensor.k1max_active_elapsed_minutes') | float(0) %}
          {% set eur_h = states('input_number.k1max_energy_cost_per_hour') | float(0) %}
          {{ ((eur_h / 60.0) * minutes) | round(2) }}
        unit_of_measurement: "EUR"
        attributes:
          minutes: "{{ states('sensor.k1max_active_elapsed_minutes') }}"
          eur_per_hour: "{{ states('input_number.k1max_energy_cost_per_hour') }}"

