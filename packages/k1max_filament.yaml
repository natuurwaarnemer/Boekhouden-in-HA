template:
  - sensor:
      - name: "k1max spool1 remaining percent"
        unique_id: "k1max_spool1_remaining_percent"
        state: >-
          {% set rem = states('input_number.k1max_spool1_remaining_g') | float(0) %}
          {% set cap = states('input_number.k1max_spool1_capacity_g') | float(0) %}
          {% if cap > 0 %}{{ ((rem / cap) * 100) | round(1) }}{% else %}0{% endif %}
        unit_of_measurement: "%"
        attributes:
          remaining_g: "{{ states('input_number.k1max_spool1_remaining_g') }}"
          capacity_g: "{{ states('input_number.k1max_spool1_capacity_g') }}"

      - name: "k1max spool2 remaining percent"
