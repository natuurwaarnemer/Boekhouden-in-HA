    mode: single

  - id: automation_erp_bevestiging_ontvangen
    alias: "ERP: Bevestiging ontvangen van n8n"
    description: "Verwerk bevestiging van n8n — zet status, reset formulier na 5 sec"
    trigger:
      - platform: state
        entity_id: input_text.erp_status
    action:
      - choose:

          # ── LEVERANCIER ──────────────────────────────────────
          - conditions:
              - condition: template
                value_template: "{{ states('input_text.erp_status').split('|')[0] == 'leverancier' }}"
            sequence:
              - service: input_text.set_value
                target:
                  entity_id: input_text.leverancier_status
                data:
                  value: "✅ {{ states('input_text.erp_status').split('|')[2] }}"
              - service: persistent_notification.create
                data:
                  title: "ERP — Leverancier"
                  message: "{{ states('input_text.erp_status').split('|')[2] }}"
                  notification_id: erp_bevestiging_leverancier
              - delay: "00:00:05"
              - service: input_text.set_value
                target:
                  entity_id:
                    - input_text.leverancier_nummer
                    - input_text.leverancier_naam
                    - input_text.leverancier_contactpersoon
                    - input_text.leverancier_adres
                    - input_text.leverancier_postcode
                    - input_text.leverancier_stad
                    - input_text.leverancier_email
                    - input_text.leverancier_telefoon
                    - input_text.leverancier_btwnummer
                    - input_text.leverancier_kvknummer
                    - input_text.leverancier_iban
                    - input_text.leverancier_notities
                    - input_text.leverancier_status
                data:
                  value: ""
              - service: input_select.select_option
                target:
                  entity_id: input_select.leverancier_land
                data:
                  option: "Nederland"

          # ── KLANT ────────────────────────────────────────────
          - conditions:
              - condition: template
                value_template: "{{ states('input_text.erp_status').split('|')[0] == 'klant' }}"
            sequence:
              - service: input_text.set_value
                target:
                  entity_id: input_text.klant_status
                data:
                  value: "✅ {{ states('input_text.erp_status').split('|')[2] }}"
              - service: persistent_notification.create
                data:
                  title: "ERP — Klant opgeslagen"
                  message: "{{ states('input_text.erp_status').split('|')[2] }}"
                  notification_id: erp_bevestiging_klant
              - delay: "00:00:05"
              - service: input_text.set_value
                target:
                  entity_id:
                    - input_text.klant_nummer
                    - input_text.klant_naam
                    - input_text.klant_contactpersoon
                    - input_text.klant_adres
                    - input_text.klant_postcode
                    - input_text.klant_stad
                    - input_text.klant_email
                    - input_text.klant_telefoon
                    - input_text.klant_btwnummer
                    - input_text.klant_kvknummer
                    - input_text.klant_iban
                    - input_text.klant_notities
                    - input_text.klant_status
                data:
                  value: ""
              - service: input_select.select_option
                target:
                  entity_id: input_select.klant_type
                data:
                  option: "Zakelijk (B2B)"
              - service: input_select.select_option
                target:
                  entity_id: input_select.klant_land
                data:
                  option: "Nederland"

          # ── FACTUUR BEHEER ───────────────────────────────────
          - conditions:
              - condition: template
                value_template: "{{ states('input_text.erp_status').split('|')[0] == 'factuur_beheer' }}"
            sequence:
              - service: input_text.set_value
                target: {entity_id: input_text.factuur_beheer_status}
                data:
                  value: "✅ {{ states('input_text.erp_status').split('|')[2] }}"
              - service: persistent_notification.create
                data:
                  title: "ERP — Facturen"
                  message: "{{ states('input_text.erp_status').split('|')[2] }}"
                  notification_id: erp_bevestiging_factuur_beheer
              - condition: template
                value_template: "{{ states('input_text.erp_status').split('|')[1] == 'verwijderd' }}"
              - service: input_text.set_value
                target: {entity_id: input_text.factuur_huidig_nummer}
                data: {value: ""}
              - service: input_text.set_value
                target: {entity_id: input_text.erp_status}
                data: {value: ""}
              - service: rest_command.n8n_facturen_per_klant_webhook

          # ── INKOOP BEHEER ─────────────────────────────────
          - conditions:
              - condition: template
                value_template: "{{ states('input_text.erp_status').split('|')[0] == 'inkoop_beheer' }}"
            sequence:
              - service: input_text.set_value
                target: {entity_id: input_text.inkoop_beheer_status}
                data:
                  value: "✅ {{ states('input_text.erp_status').split('|')[2] }}"
              - service: persistent_notification.create
                data:
                  title: "ERP — Inkoop"
                  message: "{{ states('input_text.erp_status').split('|')[2] }}"
                  notification_id: erp_bevestiging_inkoop_beheer

          # ── WACHTRIJ ─────────────────────────────────────────
          - conditions:
              - condition: template
                value_template: "{{ states('input_text.erp_status').split('|')[0] == 'wachtrij' }}"
            sequence:
              - service: input_text.set_value
                target: {entity_id: input_text.wachtrij_status}
                data:
                  value: "✅ {{ states('input_text.erp_status').split('|')[2] }}"
              - service: persistent_notification.create
                data:
                  title: "ERP — Wachtrij"
                  message: "{{ states('input_text.erp_status').split('|')[2] }}"
                  notification_id: erp_bevestiging_wachtrij

          # ── FACTUUR ──────────────────────────────────────────
          - conditions:
              - condition: template
                value_template: "{{ states('input_text.erp_status').split('|')[0] == 'factuur' }}"
            sequence:
              - service: input_text.set_value
                target:
                  entity_id: input_text.factuur_status
                data:
                  value: "✅ {{ states('input_text.erp_status').split('|')[2] }}"
              - service: persistent_notification.create
                data:
                  title: "ERP — Factuur aangemaakt"
                  message: "{{ states('input_text.erp_status').split('|')[2] }}"
                  notification_id: erp_bevestiging_factuur
              - delay: "00:00:05"
              - service: input_text.set_value
                target:
                  entity_id:
                    - input_text.factuur_project
                    - input_text.factuur_regel1_omschrijving
                    - input_text.factuur_regel2_omschrijving
                    - input_text.factuur_regel3_omschrijving
                    - input_text.factuur_notities
                    - input_text.factuur_status
                data:
                  value: ""
              - service: input_number.set_value
                target:
                  entity_id:
                    - input_number.factuur_regel1_aantal
                    - input_number.factuur_regel2_aantal
                    - input_number.factuur_regel3_aantal
                data:
                  value: 1
              - service: input_number.set_value
                target:
                  entity_id:
                    - input_number.factuur_regel1_prijs
                    - input_number.factuur_regel2_prijs
                    - input_number.factuur_regel3_prijs
                data:
                  value: 0
              - service: input_select.select_option
                target:
                  entity_id:
                    - input_select.factuur_regel1_btw
                    - input_select.factuur_regel2_btw
                    - input_select.factuur_regel3_btw
                data:
                  option: "21"

          # ── INKOOP ───────────────────────────────────────────
          - conditions:
              - condition: template
                value_template: "{{ states('input_text.erp_status').split('|')[0] == 'inkoop' }}"
            sequence:
              - service: input_text.set_value
                target:
                  entity_id: input_text.inkoop_status
                data:
                  value: "✅ {{ states('input_text.erp_status').split('|')[2] }}"
              - service: persistent_notification.create
                data:
                  title: "ERP — Inkoop opgeslagen"
                  message: "{{ states('input_text.erp_status').split('|')[2] }}"
                  notification_id: erp_bevestiging_inkoop
              - delay: "00:00:05"
              - service: input_text.set_value
                target:
                  entity_id:
                    - input_text.inkoop_factuurnummer
                    - input_text.inkoop_datum
                    - input_text.inkoop_omschrijving
                    - input_text.inkoop_status
                data:
                  value: ""
              - service: input_select.select_option
                target:
                  entity_id: input_select.inkoop_leverancier
                data:
                  option: "--- Selecteer leverancier ---"
              - service: input_number.set_value
                target:
                  entity_id: input_number.inkoop_bedrag
                data:
                  value: 0
              - service: input_select.select_option
                target:
                  entity_id: input_select.inkoop_btw
                data:
                  option: "21"

    mode: queued
    max: 4

