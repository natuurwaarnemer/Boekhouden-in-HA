# ---------------------------------------------------------
# TEMPLATE SENSORS — Berekeningen
# ---------------------------------------------------------
template:
  - sensor:

      # ── Regel 1 ──────────────────────────────────────────
      - name: "ERP Factuur Regel1 Subtotaal"
        unique_id: erp_factuur_regel1_subtotaal
        unit_of_measurement: "€"
        icon: mdi:calculator
        state: >
          {{ (states('input_number.factuur_regel1_aantal') | float(0))
           * (states('input_number.factuur_regel1_prijs') | float(0)) | round(2) }}

      - name: "ERP Factuur Regel1 BTW"
        unique_id: erp_factuur_regel1_btw
        unit_of_measurement: "€"
        icon: mdi:percent
        state: >
          {% set sub = (states('input_number.factuur_regel1_aantal') | float(0))
                     * (states('input_number.factuur_regel1_prijs') | float(0)) %}
          {% set pct = states('input_select.factuur_regel1_btw') | float(0) %}
          {{ (sub * pct / 100) | round(2) }}

      # ── Regel 2 ──────────────────────────────────────────
      - name: "ERP Factuur Regel2 Subtotaal"
        unique_id: erp_factuur_regel2_subtotaal
        unit_of_measurement: "€"
        icon: mdi:calculator
        state: >
          {{ (states('input_number.factuur_regel2_aantal') | float(0))
           * (states('input_number.factuur_regel2_prijs') | float(0)) | round(2) }}

      - name: "ERP Factuur Regel2 BTW"
        unique_id: erp_factuur_regel2_btw
        unit_of_measurement: "€"
        icon: mdi:percent
        state: >
          {% set sub = (states('input_number.factuur_regel2_aantal') | float(0))
                     * (states('input_number.factuur_regel2_prijs') | float(0)) %}
          {% set pct = states('input_select.factuur_regel2_btw') | float(0) %}
          {{ (sub * pct / 100) | round(2) }}

      # ── Interne nummers (read-only weergave) ─────────────
      - name: "Leveranciersnummer"
        unique_id: erp_leveranciersnummer
        icon: mdi:identifier
        state: "{{ states('input_text.leverancier_nummer') or '—' }}"

      - name: "Klantnummer"
        unique_id: erp_klantnummer
        icon: mdi:identifier
        state: "{{ states('input_text.klant_nummer') or '—' }}"

      # ── Regel 3 ──────────────────────────────────────────
      - name: "ERP Factuur Regel3 Subtotaal"
        unique_id: erp_factuur_regel3_subtotaal
        unit_of_measurement: "€"
        icon: mdi:calculator
        state: >
          {{ (states('input_number.factuur_regel3_aantal') | float(0))
           * (states('input_number.factuur_regel3_prijs') | float(0)) | round(2) }}

      - name: "ERP Factuur Regel3 BTW"
        unique_id: erp_factuur_regel3_btw
        unit_of_measurement: "€"
        icon: mdi:percent
        state: >
          {% set sub = (states('input_number.factuur_regel3_aantal') | float(0))
                     * (states('input_number.factuur_regel3_prijs') | float(0)) %}
          {% set pct = states('input_select.factuur_regel3_btw') | float(0) %}
          {{ (sub * pct / 100) | round(2) }}

      # ── Factuur Totalen ───────────────────────────────────
      - name: "ERP Factuur Totaal Excl BTW"
        unique_id: erp_factuur_totaal_excl_btw
        unit_of_measurement: "€"
        icon: mdi:currency-eur
        state: >
          {% set r1 = (states('input_number.factuur_regel1_aantal') | float(0))
                    * (states('input_number.factuur_regel1_prijs') | float(0)) %}
          {% set r2 = (states('input_number.factuur_regel2_aantal') | float(0))
                    * (states('input_number.factuur_regel2_prijs') | float(0)) %}
          {% set r3 = (states('input_number.factuur_regel3_aantal') | float(0))
                    * (states('input_number.factuur_regel3_prijs') | float(0)) %}
          {{ (r1 + r2 + r3) | round(2) }}

      - name: "ERP Factuur Totaal BTW"
        unique_id: erp_factuur_totaal_btw
        unit_of_measurement: "€"
        icon: mdi:percent
        state: >
          {% set r1 = (states('input_number.factuur_regel1_aantal') | float(0))
                    * (states('input_number.factuur_regel1_prijs') | float(0)) %}
          {% set r2 = (states('input_number.factuur_regel2_aantal') | float(0))
                    * (states('input_number.factuur_regel2_prijs') | float(0)) %}
          {% set r3 = (states('input_number.factuur_regel3_aantal') | float(0))
                    * (states('input_number.factuur_regel3_prijs') | float(0)) %}
          {% set b1 = r1 * (states('input_select.factuur_regel1_btw') | float(0)) / 100 %}
          {% set b2 = r2 * (states('input_select.factuur_regel2_btw') | float(0)) / 100 %}
          {% set b3 = r3 * (states('input_select.factuur_regel3_btw') | float(0)) / 100 %}
          {{ (b1 + b2 + b3) | round(2) }}

      - name: "ERP Factuur Totaal Incl BTW"
        unique_id: erp_factuur_totaal_incl_btw
        unit_of_measurement: "€"
        icon: mdi:currency-eur
        state: >
          {% set r1 = (states('input_number.factuur_regel1_aantal') | float(0))
                    * (states('input_number.factuur_regel1_prijs') | float(0)) %}
          {% set r2 = (states('input_number.factuur_regel2_aantal') | float(0))
                    * (states('input_number.factuur_regel2_prijs') | float(0)) %}
          {% set r3 = (states('input_number.factuur_regel3_aantal') | float(0))
                    * (states('input_number.factuur_regel3_prijs') | float(0)) %}
          {% set b1 = r1 * (states('input_select.factuur_regel1_btw') | float(0)) / 100 %}
          {% set b2 = r2 * (states('input_select.factuur_regel2_btw') | float(0)) / 100 %}
          {% set b3 = r3 * (states('input_select.factuur_regel3_btw') | float(0)) / 100 %}
          {{ (r1 + r2 + r3 + b1 + b2 + b3) | round(2) }}

      # ── Inkoop Berekeningen ───────────────────────────────
      - name: "ERP Inkoop BTW Bedrag"
        unique_id: erp_inkoop_btw_bedrag
        unit_of_measurement: "€"
        icon: mdi:percent
        state: >
          {% set bedrag = states('input_number.inkoop_bedrag') | float(0) %}
          {% set pct = states('input_select.inkoop_btw') | float(0) %}
          {{ (bedrag * pct / 100) | round(2) }}

      - name: "ERP Inkoop Totaal Incl BTW"
        unique_id: erp_inkoop_totaal_incl_btw
        unit_of_measurement: "€"
        icon: mdi:currency-eur
        state: >
          {% set bedrag = states('input_number.inkoop_bedrag') | float(0) %}
          {% set pct = states('input_select.inkoop_btw') | float(0) %}
          {{ (bedrag * (1 + pct / 100)) | round(2) }}


# ---------------------------------------------------------
# SCRIPT — Klant laden in formulier (aangeroepen door n8n)
# ---------------------------------------------------------
script:
  erp_leverancier_laden:
    alias: ERP Leverancier laden in formulier
    mode: single
    fields:
      nummer:       {description: Leveranciersnummer}
      naam:         {description: Bedrijfsnaam}
      contactpersoon: {description: Contactpersoon}
      adres:        {description: Adres}
      postcode:     {description: Postcode}
      stad:         {description: Stad}
      land:         {description: Land}
      email:        {description: E-mailadres}
      telefoon:     {description: Telefoonnummer}
      btwnummer:    {description: BTW-nummer}
      kvknummer:    {description: KVK-nummer}
      iban:         {description: IBAN}
      notities:     {description: Notities}
    sequence:
      - service: input_text.set_value
        target: {entity_id: input_text.leverancier_nummer}
        data: {value: "LV-{{ nummer }}"}
      - service: input_text.set_value
        target: {entity_id: input_text.leverancier_naam}
        data: {value: "{{ naam }}"}
      - service: input_text.set_value
        target: {entity_id: input_text.leverancier_contactpersoon}
        data: {value: "{{ contactpersoon }}"}
      - service: input_text.set_value
        target: {entity_id: input_text.leverancier_adres}
        data: {value: "{{ adres }}"}
      - service: input_text.set_value
        target: {entity_id: input_text.leverancier_postcode}
        data: {value: "{{ postcode }}"}
      - service: input_text.set_value
        target: {entity_id: input_text.leverancier_stad}
        data: {value: "{{ stad }}"}
      - service: input_select.select_option
        target: {entity_id: input_select.leverancier_land}
        data: {option: "{{ land }}"}
      - service: input_text.set_value
        target: {entity_id: input_text.leverancier_email}
        data: {value: "{{ email }}"}
      - service: input_text.set_value
        target: {entity_id: input_text.leverancier_telefoon}
        data: {value: "{{ telefoon }}"}
      - service: input_text.set_value
        target: {entity_id: input_text.leverancier_btwnummer}
        data: {value: "{{ btwnummer }}"}
      - service: input_text.set_value
        target: {entity_id: input_text.leverancier_kvknummer}
        data: {value: "{{ kvknummer }}"}
      - service: input_text.set_value
        target: {entity_id: input_text.leverancier_iban}
        data: {value: "{{ iban }}"}
      - service: input_text.set_value
