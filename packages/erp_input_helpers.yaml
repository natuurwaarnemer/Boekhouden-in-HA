# =============================================================
# Natuurwaarnemer ERP — Home Assistant Package
# =============================================================
# Kopieer dit bestand naar /config/packages/erp_input_helpers.yaml
#
# Zorg dat in configuration.yaml staat:
#   homeassistant:
#     packages: !include_dir_named packages/
#
# Zorg dat in secrets.yaml staat:
#   n8n_webhook_factuur: "http://192.168.2.35:5678/webhook/factuur-aanmaken"
#   n8n_webhook_kosten:  "http://192.168.2.35:5678/webhook/kosten-opslaan"
#   n8n_webhook_inkoop:  "http://192.168.2.35:5678/webhook/inkoop-opslaan"
#   n8n_webhook_klant:   "http://192.168.2.35:5678/webhook/klant-opslaan"

# ---------------------------------------------------------
# REST COMMANDS — HA naar n8n webhooks
# ---------------------------------------------------------
rest_command:

  # ── FACTUREN CRUD ────────────────────────────────────────
  n8n_facturen_per_klant_webhook:
    url: !secret n8n_webhook_facturen_per_klant
    method: POST
    content_type: application/json
    payload: '{"klant": "{{ states(''input_select.factuur_klant'') }}"}'

  n8n_factuur_detail_webhook:
    url: !secret n8n_webhook_factuur_detail
    method: POST
    content_type: application/json
    payload: '{"factuurnummer": "{{ states(''input_select.factuur_selecteer'').split('' | '')[0] }}"}'

  n8n_factuur_bijwerken_webhook:
    url: !secret n8n_webhook_factuur_bijwerken
    method: POST
    content_type: application/json
    payload: >
      {
        "factuurnummer":  "{{ states('input_text.factuur_huidig_nummer') }}",
        "notities":       "{{ states('input_text.factuur_notities') }}",
        "omschrijving1":  "{{ states('input_text.factuur_regel1_omschrijving') }}",
        "aantal1":        {{ states('input_number.factuur_regel1_aantal') }},
        "prijs1":         {{ states('input_number.factuur_regel1_prijs') }},
        "btw1":           "{{ states('input_select.factuur_regel1_btw') }}",
        "omschrijving2":  "{{ states('input_text.factuur_regel2_omschrijving') }}",
        "aantal2":        {{ states('input_number.factuur_regel2_aantal') }},
        "prijs2":         {{ states('input_number.factuur_regel2_prijs') }},
        "btw2":           "{{ states('input_select.factuur_regel2_btw') }}",
        "omschrijving3":  "{{ states('input_text.factuur_regel3_omschrijving') }}",
        "aantal3":        {{ states('input_number.factuur_regel3_aantal') }},
        "prijs3":         {{ states('input_number.factuur_regel3_prijs') }},
        "btw3":           "{{ states('input_select.factuur_regel3_btw') }}"
      }

  n8n_factuur_verwijderen_webhook:
    url: !secret n8n_webhook_factuur_verwijderen
    method: POST
    content_type: application/json
    payload: '{"factuurnummer": "{{ states(''input_text.factuur_huidig_nummer'') }}"}'

  # ── INKOOP CRUD ───────────────────────────────────────────
  n8n_inkopen_per_lev_webhook:
    url: !secret n8n_webhook_inkopen_per_lev
    method: POST
    content_type: application/json
    payload: '{"leverancier": "{{ states(''input_select.inkoop_leverancier'') }}"}'

  n8n_inkoop_detail_webhook:
    url: !secret n8n_webhook_inkoop_detail
    method: POST
    content_type: application/json
    payload: '{"inkoop_id": "{{ states(''input_select.inkoop_selecteer'').split('' | '')[0] }}"}'

  n8n_inkoop_bijwerken_webhook:
    url: !secret n8n_webhook_inkoop_bijwerken
    method: POST
    content_type: application/json
    payload: >
      {
        "inkoop_id":      "{{ states('input_text.inkoop_huidig_id') }}",
        "factuurnummer":  "{{ states('input_text.inkoop_factuurnummer') }}",
        "datum":          "{{ states('input_text.inkoop_datum') }}",
        "omschrijving":   "{{ states('input_text.inkoop_omschrijving') }}",
        "bedrag":         {{ states('input_number.inkoop_bedrag') }},
        "btw":            "{{ states('input_select.inkoop_btw') }}",
        "grootboek":      "{{ states('input_select.inkoop_grootboek') }}"
      }

  n8n_inkoop_verwijderen_webhook:
    url: !secret n8n_webhook_inkoop_verwijderen
    method: POST
    content_type: application/json
    payload: '{"inkoop_id": "{{ states(''input_text.inkoop_huidig_id'') }}"}'

  n8n_wachtrij_ophalen_webhook:
    url: !secret n8n_webhook_wachtrij_ophalen
    method: POST
    content_type: application/json
    payload: '{}'

  n8n_wachtrij_versturen_webhook:
    url: !secret n8n_webhook_wachtrij_versturen
    method: POST
    content_type: application/json
    payload: "{% set ns = namespace(items=[]) %}{% for i in range(1, 11) %}{% set nr = states('input_text.wachtrij_slot_' ~ i).split('|')[0] %}{% if nr != '' %}{% set v = states('input_boolean.wachtrij_verstuur_' ~ i) == 'on' %}{% set ns.items = ns.items + [{'nr': nr, 'versturen': v}] %}{% endif %}{% endfor %}{{ {'facturen': ns.items} | to_json }}"

  n8n_factuur_webhook:
    url: !secret n8n_webhook_factuur
    method: POST
    content_type: application/json
    payload: >
      {
        "klant":          "{{ states('input_select.factuur_klant') }}",
        "project":        "{{ states('input_text.factuur_project') }}",
        "grootboek":      "{{ states('input_select.factuur_grootboek') }}",
        "omschrijving1":  "{{ states('input_text.factuur_regel1_omschrijving') }}",
        "aantal1":        {{ states('input_number.factuur_regel1_aantal') }},
        "prijs1":         {{ states('input_number.factuur_regel1_prijs') }},
        "btw1":           "{{ states('input_select.factuur_regel1_btw') }}",
        "omschrijving2":  "{{ states('input_text.factuur_regel2_omschrijving') }}",
        "aantal2":        {{ states('input_number.factuur_regel2_aantal') }},
        "prijs2":         {{ states('input_number.factuur_regel2_prijs') }},
        "btw2":           "{{ states('input_select.factuur_regel2_btw') }}",
        "omschrijving3":  "{{ states('input_text.factuur_regel3_omschrijving') }}",
        "aantal3":        {{ states('input_number.factuur_regel3_aantal') }},
        "prijs3":         {{ states('input_number.factuur_regel3_prijs') }},
        "btw3":           "{{ states('input_select.factuur_regel3_btw') }}",
        "notities":       "{{ states('input_text.factuur_notities') }}"
      }

  n8n_inkoop_webhook:
    url: !secret n8n_webhook_inkoop
    method: POST
    content_type: application/json
    payload: >
      {
        "leverancier":    "{{ states('input_select.inkoop_leverancier') }}",
        "factuurnummer":  "{{ states('input_text.inkoop_factuurnummer') }}",
        "datum":          "{{ states('input_text.inkoop_datum') }}",
        "omschrijving":   "{{ states('input_text.inkoop_omschrijving') }}",
        "bedrag":         {{ states('input_number.inkoop_bedrag') }},
        "btw":            "{{ states('input_select.inkoop_btw') }}",
        "grootboek":      "{{ states('input_select.inkoop_grootboek') }}"
      }

  n8n_ververs_klanten:
    url: !secret n8n_webhook_ververs_klanten
    method: POST
    content_type: application/json
    payload: '{}'

  n8n_ververs_leveranciers:
    url: !secret n8n_webhook_ververs_leveranciers
    method: POST
    content_type: application/json
    payload: '{}'

  n8n_leverancier_webhook:
    url: !secret n8n_webhook_leverancier
    method: POST
    content_type: application/json
    payload: >
      {
        "naam":           "{{ states('input_text.leverancier_naam') }}",
        "contactpersoon": "{{ states('input_text.leverancier_contactpersoon') }}",
        "adres":          "{{ states('input_text.leverancier_adres') }}",
        "postcode":       "{{ states('input_text.leverancier_postcode') }}",
        "stad":           "{{ states('input_text.leverancier_stad') }}",
        "land":           "{{ states('input_select.leverancier_land') }}",
        "email":          "{{ states('input_text.leverancier_email') }}",
        "telefoon":       "{{ states('input_text.leverancier_telefoon') }}",
        "btwnummer":      "{{ states('input_text.leverancier_btwnummer') }}",
        "kvknummer":      "{{ states('input_text.leverancier_kvknummer') }}",
        "iban":           "{{ states('input_text.leverancier_iban') }}",
        "notities":       "{{ states('input_text.leverancier_notities') }}"
      }

  n8n_leverancier_laden_webhook:
    url: !secret n8n_webhook_leverancier_laden
    method: POST
    content_type: application/json
    payload: >
      {
        "naam": "{{ states('input_select.inkoop_leverancier') }}"
      }

  n8n_leverancier_bijwerken_webhook:
    url: !secret n8n_webhook_leverancier_bijwerken
    method: POST
    content_type: application/json
    payload: >
      {
        "naam_huidig":    "{{ states('input_select.inkoop_leverancier') }}",
        "naam":           "{{ states('input_text.leverancier_naam') }}",
        "contactpersoon": "{{ states('input_text.leverancier_contactpersoon') }}",
        "adres":          "{{ states('input_text.leverancier_adres') }}",
        "postcode":       "{{ states('input_text.leverancier_postcode') }}",
        "stad":           "{{ states('input_text.leverancier_stad') }}",
        "land":           "{{ states('input_select.leverancier_land') }}",
        "email":          "{{ states('input_text.leverancier_email') }}",
        "telefoon":       "{{ states('input_text.leverancier_telefoon') }}",
        "btwnummer":      "{{ states('input_text.leverancier_btwnummer') }}",
        "kvknummer":      "{{ states('input_text.leverancier_kvknummer') }}",
        "iban":           "{{ states('input_text.leverancier_iban') }}",
        "notities":       "{{ states('input_text.leverancier_notities') }}"
      }

  n8n_leverancier_verwijderen_webhook:
    url: !secret n8n_webhook_leverancier_verwijderen
    method: POST
    content_type: application/json
    payload: >
      {
        "naam": "{{ states('input_select.inkoop_leverancier') }}"
      }

  n8n_klant_webhook:
    url: !secret n8n_webhook_klant
    method: POST
    content_type: application/json
    payload: >
      {
        "naam":           "{{ states('input_text.klant_naam') }}",
        "type":           "{{ states('input_select.klant_type') }}",
        "contactpersoon": "{{ states('input_text.klant_contactpersoon') }}",
        "adres":          "{{ states('input_text.klant_adres') }}",
        "postcode":       "{{ states('input_text.klant_postcode') }}",
        "stad":           "{{ states('input_text.klant_stad') }}",
        "land":           "{{ states('input_select.klant_land') }}",
        "email":          "{{ states('input_text.klant_email') }}",
        "telefoon":       "{{ states('input_text.klant_telefoon') }}",
        "btwnummer":      "{{ states('input_text.klant_btwnummer') }}",
        "kvknummer":      "{{ states('input_text.klant_kvknummer') }}",
        "iban":           "{{ states('input_text.klant_iban') }}",
        "notities":       "{{ states('input_text.klant_notities') }}"
      }

  n8n_klant_laden_webhook:
    url: !secret n8n_webhook_klant_laden
    method: POST
    content_type: application/json
    payload: >
      {
        "naam": "{{ states('input_select.factuur_klant') }}"
      }

  n8n_klant_bijwerken_webhook:
    url: !secret n8n_webhook_klant_bijwerken
    method: POST
    content_type: application/json
    payload: >
      {
        "naam_huidig":    "{{ states('input_select.factuur_klant') }}",
        "naam":           "{{ states('input_text.klant_naam') }}",
        "type":           "{{ states('input_select.klant_type') }}",
        "contactpersoon": "{{ states('input_text.klant_contactpersoon') }}",
        "adres":          "{{ states('input_text.klant_adres') }}",
        "postcode":       "{{ states('input_text.klant_postcode') }}",
        "stad":           "{{ states('input_text.klant_stad') }}",
        "land":           "{{ states('input_select.klant_land') }}",
        "email":          "{{ states('input_text.klant_email') }}",
        "telefoon":       "{{ states('input_text.klant_telefoon') }}",
        "btwnummer":      "{{ states('input_text.klant_btwnummer') }}",
        "kvknummer":      "{{ states('input_text.klant_kvknummer') }}",
        "iban":           "{{ states('input_text.klant_iban') }}",
        "notities":       "{{ states('input_text.klant_notities') }}"
      }

  n8n_klant_verwijderen_webhook:
    url: !secret n8n_webhook_klant_verwijderen
    method: POST
    content_type: application/json
    payload: >
      {
        "naam": "{{ states('input_select.factuur_klant') }}"
      }

# ---------------------------------------------------------
# AUTOMATIONS — Buttons naar n8n + bevestiging + reset
# ---------------------------------------------------------
automation:

  # ── FACTUREN CRUD ────────────────────────────────────────
  - id: automation_factuur_selecteer_gewijzigd
    alias: "ERP: Factuurnummer zetten bij selectie"
    trigger:
      - platform: state
        entity_id: input_select.factuur_selecteer
    condition:
      - condition: template
        value_template: "{{ states('input_select.factuur_selecteer') != '--- Selecteer factuur ---' }}"
    action:
      - service: input_text.set_value
        target: {entity_id: input_text.factuur_huidig_nummer}
        data:
          value: "{{ states('input_select.factuur_selecteer').split(' | ')[0] }}"
    mode: single

  - id: automation_factuur_klant_gewijzigd
    alias: "ERP: Facturen laden bij klant selectie"
    trigger:
      - platform: state
        entity_id: input_select.factuur_klant
    condition:
      - condition: template
        value_template: "{{ states('input_select.factuur_klant') != '--- Selecteer klant ---' }}"
    action:
      - service: input_select.select_option
        target: {entity_id: input_select.factuur_selecteer}
        data: {option: "--- Selecteer factuur ---"}
      - service: input_text.set_value
        target: {entity_id: input_text.factuur_beheer_status}
        data: {value: "⏳ Facturen ophalen..."}
      - service: input_text.set_value
        target: {entity_id: input_text.erp_status}
        data: {value: ""}
      - service: rest_command.n8n_facturen_per_klant_webhook
    mode: single

  - id: automation_factuur_lijst_ophalen
    alias: "ERP: Facturen per klant ophalen"
    trigger:
      - platform: state
        entity_id: input_button.factuur_lijst_ophalen
    action:
      - service: input_text.set_value
        target: {entity_id: input_text.factuur_beheer_status}
        data: {value: "⏳ Facturen ophalen..."}
      - service: input_text.set_value
        target: {entity_id: input_text.erp_status}
        data: {value: ""}
      - service: rest_command.n8n_facturen_per_klant_webhook
    mode: single

  - id: automation_factuur_detail_laden
    alias: "ERP: Factuur detail laden"
    trigger:
      - platform: state
        entity_id: input_button.factuur_detail_laden
    condition:
      - condition: template
        value_template: "{{ states('input_select.factuur_selecteer') != '--- Selecteer factuur ---' }}"
    action:
      - service: input_text.set_value
        target: {entity_id: input_text.factuur_beheer_status}
        data: {value: "⏳ Factuur laden..."}
      - service: input_text.set_value
        target: {entity_id: input_text.erp_status}
        data: {value: ""}
      - service: rest_command.n8n_factuur_detail_webhook
    mode: single

  - id: automation_factuur_bijwerken
    alias: "ERP: Factuur bijwerken"
    trigger:
      - platform: state
        entity_id: input_button.factuur_bijwerken_btn
    condition:
      - condition: template
        value_template: "{{ states('input_text.factuur_huidig_nummer') != '' }}"
    action:
      - service: input_text.set_value
        target: {entity_id: input_text.factuur_beheer_status}
        data: {value: "⏳ Bijwerken..."}
      - service: input_text.set_value
        target: {entity_id: input_text.erp_status}
        data: {value: ""}
      - service: rest_command.n8n_factuur_bijwerken_webhook
    mode: single

  - id: automation_factuur_verwijderen
    alias: "ERP: Factuur verwijderen"
    trigger:
      - platform: state
        entity_id: input_button.factuur_verwijderen_btn
    condition:
      - condition: template
        value_template: "{{ states('input_text.factuur_huidig_nummer') != '' }}"
    action:
      - service: input_text.set_value
        target: {entity_id: input_text.factuur_beheer_status}
        data: {value: "⏳ Verwijderen..."}
      - service: input_text.set_value
        target: {entity_id: input_text.erp_status}
        data: {value: ""}
      - service: rest_command.n8n_factuur_verwijderen_webhook
    mode: single

  # ── INKOOP CRUD ───────────────────────────────────────────
  - id: automation_inkoop_leverancier_gewijzigd
    alias: "ERP: Inkopen laden bij leverancier selectie"
    trigger:
      - platform: state
        entity_id: input_select.inkoop_leverancier
    condition:
      - condition: template
        value_template: "{{ states('input_select.inkoop_leverancier') != '--- Selecteer leverancier ---' }}"
    action:
      - service: input_select.select_option
        target: {entity_id: input_select.inkoop_selecteer}
        data: {option: "--- Selecteer inkoop ---"}
      - service: input_text.set_value
        target: {entity_id: input_text.inkoop_beheer_status}
        data: {value: "⏳ Inkopen ophalen..."}
      - service: input_text.set_value
        target: {entity_id: input_text.erp_status}
        data: {value: ""}
      - service: rest_command.n8n_inkopen_per_lev_webhook
    mode: single

  - id: automation_inkoop_selecteer_gewijzigd
    alias: "ERP: Inkoop ID zetten bij selectie"
    trigger:
      - platform: state
        entity_id: input_select.inkoop_selecteer
    condition:
      - condition: template
        value_template: "{{ states('input_select.inkoop_selecteer') != '--- Selecteer inkoop ---' }}"
    action:
      - service: input_text.set_value
        target: {entity_id: input_text.inkoop_huidig_id}
        data:
          value: "{{ states('input_select.inkoop_selecteer').split(' | ')[0] }}"
    mode: single

  - id: automation_inkoop_lijst_ophalen
    alias: "ERP: Inkopen per leverancier ophalen"
    trigger:
      - platform: state
        entity_id: input_button.inkoop_lijst_ophalen
    action:
      - service: input_text.set_value
        target: {entity_id: input_text.inkoop_beheer_status}
        data: {value: "⏳ Inkopen ophalen..."}
      - service: input_text.set_value
        target: {entity_id: input_text.erp_status}
        data: {value: ""}
      - service: rest_command.n8n_inkopen_per_lev_webhook
    mode: single

  - id: automation_inkoop_detail_laden
    alias: "ERP: Inkoop detail laden"
    trigger:
      - platform: state
        entity_id: input_button.inkoop_detail_laden
    condition:
      - condition: template
        value_template: "{{ states('input_select.inkoop_selecteer') != '--- Selecteer inkoop ---' }}"
    action:
      - service: input_text.set_value
        target: {entity_id: input_text.inkoop_beheer_status}
        data: {value: "⏳ Inkoop laden..."}
      - service: input_text.set_value
        target: {entity_id: input_text.erp_status}
        data: {value: ""}
      - service: rest_command.n8n_inkoop_detail_webhook
    mode: single

  - id: automation_inkoop_bijwerken
    alias: "ERP: Inkoop bijwerken"
    trigger:
      - platform: state
        entity_id: input_button.inkoop_bijwerken_btn
    condition:
      - condition: template
        value_template: "{{ states('input_text.inkoop_huidig_id') != '' }}"
    action:
      - service: input_text.set_value
        target: {entity_id: input_text.inkoop_beheer_status}
        data: {value: "⏳ Bijwerken..."}
      - service: input_text.set_value
        target: {entity_id: input_text.erp_status}
        data: {value: ""}
      - service: rest_command.n8n_inkoop_bijwerken_webhook
    mode: single

  - id: automation_inkoop_verwijderen
    alias: "ERP: Inkoop verwijderen"
    trigger:
      - platform: state
        entity_id: input_button.inkoop_verwijderen_btn
    condition:
      - condition: template
        value_template: "{{ states('input_text.inkoop_huidig_id') != '' }}"
    action:
      - service: input_text.set_value
        target: {entity_id: input_text.inkoop_beheer_status}
        data: {value: "⏳ Verwijderen..."}
      - service: input_text.set_value
        target: {entity_id: input_text.erp_status}
        data: {value: ""}
      - service: rest_command.n8n_inkoop_verwijderen_webhook
    mode: single

  - id: automation_wachtrij_ververs
    alias: "ERP: Wachtrij vernieuwen"
    trigger:
      - platform: state
        entity_id: input_button.wachtrij_ververs
    action:
      - service: input_text.set_value
        target: {entity_id: input_text.wachtrij_status}
        data: {value: "⏳ Wachtrij laden..."}
      - service: input_text.set_value
        target: {entity_id: input_text.erp_status}
        data: {value: ""}
      - service: rest_command.n8n_wachtrij_ophalen_webhook
    mode: single

  - id: automation_wachtrij_versturen
    alias: "ERP: Wachtrij geselecteerde versturen"
    trigger:
      - platform: state
        entity_id: input_button.wachtrij_versturen
    action:
      - service: input_text.set_value
        target: {entity_id: input_text.wachtrij_status}
        data: {value: "⏳ Facturen versturen..."}
      - service: input_text.set_value
        target: {entity_id: input_text.erp_status}
        data: {value: ""}
      - service: rest_command.n8n_wachtrij_versturen_webhook
    mode: single

  - id: automation_factuur_genereren
    alias: "ERP: Factuur genereren"
    description: "Stuur factuurdata naar n8n voor verwerking en PDF-generatie"
    trigger:
      - platform: state
        entity_id: input_button.factuur_genereer
    action:
      - service: input_text.set_value
        target:
          entity_id: input_text.factuur_status
        data:
          value: "⏳ Bezig met aanmaken..."
      - service: input_text.set_value
        target:
          entity_id: input_text.erp_status
