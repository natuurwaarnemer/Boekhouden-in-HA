# ══════════════════════════════════════════════════════
#  HOME ASSISTANT PACKAGE — Filament Droogkast
#  Bestand: config/packages/droogkast_ha.yaml
# ══════════════════════════════════════════════════════

template:
  - sensor:
      - name: "Droogkast Actieve Spool Naam"
        unique_id: droogkast_actieve_spool_naam
        state: >
          {% set spool = states('input_select.k1max_spool_active') %}
          {{ states('sensor.k1max_' ~ spool ~ '_filament_metadata') }}
        icon: mdi:printer-3d-nozzle

      - name: "Droogkast Actieve Spool Kleur"
        unique_id: droogkast_actieve_spool_kleur
        state: >
          {% set spool = states('input_select.k1max_spool_active') %}
          {{ states('sensor.k1max_' ~ spool ~ '_filament_color') }}
        icon: mdi:palette

      - name: "Droogkast Actieve Spool Resterend"
        unique_id: droogkast_actieve_spool_resterend
        state: >
          {% set spool = states('input_select.k1max_spool_active') %}
          {{ states('input_number.k1max_' ~ spool ~ '_remaining_g') | float(0) | round(0) }}
        unit_of_measurement: "g"
        device_class: weight
        icon: mdi:weight-gram

      - name: "Droogkast Actieve Spool Drempel"
        unique_id: droogkast_actieve_spool_drempel
        state: >
          {% set spool = states('input_select.k1max_spool_active') %}
          {{ states('input_number.k1max_' ~ spool ~ '_low_threshold_g') | float(0) | round(0) }}
        unit_of_measurement: "g"
        icon: mdi:alert-circle-outline

  - binary_sensor:
      - name: "Droogkast Filament Bijna Op"
        unique_id: droogkast_filament_bijna_op
        state: >
          {% set spool = states('input_select.k1max_spool_active') %}
          {% set remaining = states('input_number.k1max_' ~ spool ~ '_remaining_g') | float(0) %}
          {% set threshold = states('input_number.k1max_' ~ spool ~ '_low_threshold_g') | float(0) %}
          {{ remaining < threshold and threshold > 0 }}
        icon: mdi:alert
        device_class: problem

automation:
  - alias: "Droogkast - Filament Bijna Op"
    id: droogkast_filament_bijna_op_notif
    trigger:
      - platform: state
        entity_id: binary_sensor.droogkast_filament_bijna_op
        to: "on"
    action:
      - service: persistent_notification.create
        data:
          title: "Filament bijna op!"
          message: >
            Spool: {{ states('input_select.k1max_spool_active') }}
            Filament: {{ states('sensor.droogkast_actieve_spool_naam') }}
            Kleur: {{ states('sensor.droogkast_actieve_spool_kleur') }}
            Resterend: {{ states('sensor.droogkast_actieve_spool_resterend') }}g
            Drempel: {{ states('sensor.droogkast_actieve_spool_drempel') }}g

  - alias: "Droogkast - Vochtalarm"
    id: droogkast_vochtalarm_notif
    trigger:
      - platform: state
        entity_id: binary_sensor.droogkast_vochtalarm
        to: "on"
    action:
      - service: persistent_notification.create
        data:
          title: "Droogkast Vochtalarm"
          message: >
            Luchtvochtigheid te hoog:
            {{ states('sensor.droogkast_luchtvochtigheid') }}%
            Limiet: 25%

  - alias: "Droogkast - Temperatuur Alarm"
    id: droogkast_temp_alarm_notif
    trigger:
      - platform: state
        entity_id: binary_sensor.droogkast_temperatuur_alarm
        to: "on"
    action:
      - service: persistent_notification.create
        data:
          title: "Droogkast Temperatuur Alarm"
          message: >
            Temperatuur buiten bereik:
            {{ states('sensor.droogkast_temperatuur') }}°C
            Normaal bereik: 30 tot 55°C

  - alias: "Droogkast - Drukverschil Alarm"
    id: droogkast_druk_alarm_notif
    trigger:
      - platform: state
        entity_id: binary_sensor.droogkast_druk_alarm
        to: "on"
    action:
      - service: persistent_notification.create
        data:
          title: "Droogkast Drukverschil Afwijking"
          message: >
            Drukverschil buiten normaal bereik:
            {{ states('sensor.droogkast_drukverschil') }} Pa