# ══════════════════════════════════════════════════════
#  ESPHOME YAML — Filament Droogkast
#  Hardware : Seeed Studio XIAO ESP32-C6
#             Grove AHT20        (I2C  3.3V  0x38)
#             Sensirion SDP810   (I2C  3.3V  0x25)
#             ILI9341 2.8" SPI display  (3.3V)
#  Voeding  : HiLink HLK-5M05  230V naar 5V
# ══════════════════════════════════════════════════════

esphome:
  name: filament-droogkast
  friendly_name: Filament Droogkast

esp32:
  board: esp32-c6-devkitm-1
  framework:
    type: esp-idf

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Droogkast Fallback"
    password: "droogkast123"

captive_portal:

i2c:
  sda: GPIO22
  scl: GPIO23
  scan: true
  frequency: 100000

spi:
  clk_pin: GPIO19
  mosi_pin: GPIO18

font:
  - file:
      family: Anton
      weight: 400
      type: gfonts
    id: font_small
    size: 15
  - file:
      family: Anton
      weight: 400
      type: gfonts
    id: font_medium
    size: 22
  - file:
      family: Anton
      weight: 400
      type: gfonts
    id: font_large
    size: 30
  - file:
      family: Anton
      weight: 400
      type: gfonts
    id: font_title
    size: 17
  - file:
      family: Anton
      weight: 400
      type: gfonts
    id: font_label
    size: 11

color:
  - id: color_white
    hex: "FFFFFF"
  - id: color_black
    hex: "000000"
  - id: color_cyan
    hex: "00FFFF"
  - id: color_yellow
    hex: "FFFF00"
  - id: color_red
    hex: "FF3333"
  - id: color_green
    hex: "00FF88"
  - id: color_orange
    hex: "FF8800"
  - id: color_blue
    hex: "66AAFF"
  - id: color_dark_bg
    hex: "001830"
  - id: color_panel_bg
    hex: "003060"
  - id: color_accent
    hex: "0088FF"
  - id: color_grey
    hex: "888888"

globals:
  - id: druk_nul_teller
    type: int
    restore_value: false
    initial_value: '0'

number:
  - platform: template
    name: "Drempel Vocht Max"
    id: drempel_vocht_max
    min_value: 10
    max_value: 80
    step: 1
    initial_value: 40
    restore_value: true
    optimistic: true
    unit_of_measurement: "%"
    icon: mdi:water-percent

  - platform: template
    name: "Drempel Temp Max"
    id: drempel_temp_max
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 40
    restore_value: true
    optimistic: true
    unit_of_measurement: "°C"
    icon: mdi:thermometer-high
    on_value:
      then:
        - lambda: |-
            if (id(drempel_temp_max).state <= id(drempel_temp_min).state) {
              auto call = id(drempel_temp_min).make_call();
              call.set_value(id(drempel_temp_max).state - 1);
              call.perform();
            }

  - platform: template
    name: "Drempel Temp Min"
    id: drempel_temp_min
    min_value: 0
    max_value: 60
    step: 1
    initial_value: 20
    restore_value: true
    optimistic: true
    unit_of_measurement: "°C"
    icon: mdi:thermometer-low
    on_value:
      then:
        - lambda: |-
            if (id(drempel_temp_min).state >= id(drempel_temp_max).state) {
              auto call = id(drempel_temp_max).make_call();
              call.set_value(id(drempel_temp_min).state + 1);
              call.perform();
            }

  - platform: template
    name: "Druk Nul Timeout"
    id: druk_nul_timeout
    min_value: 10
    max_value: 300
    step: 10
    initial_value: 60
    restore_value: true
    optimistic: true
    unit_of_measurement: "s"
    icon: mdi:timer-outline

sensor:
  - platform: aht10
    variant: AHT20
    temperature:
      name: "Droogkast Temperatuur"
      id: sensor_temp
      unit_of_measurement: "°C"
      accuracy_decimals: 1
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 5
    humidity:
      name: "Droogkast Luchtvochtigheid"
      id: sensor_hum
      unit_of_measurement: "%"
      accuracy_decimals: 1
      filters:
        - sliding_window_moving_average:
            window_size: 5
            send_every: 5
    update_interval: 10s

  - platform: sdp3x
    name: "Droogkast Drukverschil"
    id: sensor_pressure
    address: 0x25
    unit_of_measurement: "Pa"
    accuracy_decimals: 2
    update_interval: 1s
    filters:
      - multiply: 100
      - sliding_window_moving_average:
          window_size: 3
          send_every: 1

  - platform: homeassistant
    id: spool_resterend
    entity_id: sensor.droogkast_actieve_spool_resterend
    internal: true

  - platform: homeassistant
    id: spool_drempel
    entity_id: sensor.droogkast_actieve_spool_drempel
    internal: true

text_sensor:
  - platform: homeassistant
    id: spool_naam
    entity_id: sensor.droogkast_actieve_spool_naam
    internal: true

  - platform: homeassistant
    id: spool_kleur
    entity_id: sensor.droogkast_actieve_spool_kleur
    internal: true

  - platform: homeassistant
    id: spool_actief_id
    entity_id: input_select.k1max_spool_active
    internal: true

  - platform: template
    name: "Vocht Status"
    id: vocht_status
    lambda: |-
      if (!id(sensor_hum).has_state()) return {"Onbekend"};
      float h = id(sensor_hum).state;
      if (h > 40.0f)       return {"Verbeteren"};
      else if (h > 30.0f)  return {"Bijna OK"};
      else if (h > 25.0f)  return {"Prima"};
      else if (h > 20.0f)  return {"Perfect"};
      else                 return {"Uitstekend"};
    update_interval: 10s
    icon: mdi:water-percent

  - platform: template
    name: "Temp Status"
    id: temp_status
    lambda: |-
      if (!id(sensor_temp).has_state()) return {"Onbekend"};
      float t = id(sensor_temp).state;
      if (t < 20.0f)       return {"Te Koud"};
      else if (t <= 30.0f) return {"Prima"};
      else if (t <= 40.0f) return {"Perfect"};
      else                 return {"Te Warm"};
    update_interval: 10s
    icon: mdi:thermometer

  - platform: template
    name: "Druk Status"
    id: druk_status
    lambda: |-
      if (!id(sensor_pressure).has_state()) return {"Onbekend"};
      float p = id(sensor_pressure).state;
      float ap = fabsf(p);
      if (id(alarm_druk).state)    return {"!! ALARM !!"};
      else if (p > 3.0f)           return {"Deur Open"};
      else if (ap >= 0.05f)        return {"Droogt"};
      else                         return {"Wacht..."};
    update_interval: 1s
    icon: mdi:gauge

binary_sensor:
  - platform: template
    name: "Droogkast Vochtalarm"
    id: alarm_vocht
    lambda: |-
      if (id(sensor_hum).has_state()) {
        return id(sensor_hum).state > 40.0f;
      }
      return false;
    device_class: moisture

  - platform: template
    name: "Droogkast Temperatuur Alarm"
    id: alarm_temp
    lambda: |-
      if (id(sensor_temp).has_state() &&
          id(drempel_temp_max).has_state() &&
          id(drempel_temp_min).has_state()) {
        return id(sensor_temp).state > id(drempel_temp_max).state
               || id(sensor_temp).state < id(drempel_temp_min).state;
      }
      return false;
    device_class: heat

  - platform: template
    name: "Droogkast Druk Alarm"
    id: alarm_druk
    lambda: |-
      if (id(sensor_pressure).has_state() &&
          id(druk_nul_timeout).has_state()) {
        float ap = fabsf(id(sensor_pressure).state);
        if (ap >= 0.05f) {
          id(druk_nul_teller) = 0;
        } else {
          id(druk_nul_teller) += 1;
        }
        return id(druk_nul_teller) >=
               (int)id(druk_nul_timeout).state;
      }
      return false;

  - platform: homeassistant
    id: alarm_filament
    entity_id: binary_sensor.droogkast_filament_bijna_op
    internal: true

display:
  - platform: ili9xxx
    model: ILI9341
    dc_pin: GPIO21
    reset_pin: GPIO16
    cs_pin: GPIO17
    rotation: 90
    invert_colors: true
    update_interval: 1s
    lambda: |-
      it.fill(id(color_dark_bg));

      it.filled_rectangle(0, 0, 320, 28, id(color_panel_bg));
      it.horizontal_line(0, 28, 320, id(color_accent));
      it.print(160, 5, id(font_title), id(color_cyan),
               TextAlign::TOP_CENTER, "FILAMENT DROOGKAST");

      it.filled_rectangle(0, 32, 157, 120, id(color_panel_bg));
      it.print(4, 34, id(font_label), id(color_grey),
               TextAlign::TOP_LEFT, "T\xb0""C");

      if (id(sensor_temp).has_state()) {
        char temp_buf[10];
        snprintf(temp_buf, sizeof(temp_buf), "%.1f C",
                 id(sensor_temp).state);
        Color tc = id(alarm_temp).state
                   ? id(color_red) : id(color_green);
        it.print(78, 36, id(font_large), tc,
                 TextAlign::TOP_CENTER, temp_buf);
      } else {
        it.print(78, 36, id(font_large), id(color_orange),
                 TextAlign::TOP_CENTER, "--- C");
      }
      if (id(temp_status).has_state()) {
        it.print(78, 68, id(font_small), id(color_cyan),
                 TextAlign::TOP_CENTER,
                 id(temp_status).state.c_str());
      }

      it.horizontal_line(8, 86, 141, id(color_accent));
      it.print(4, 90, id(font_label), id(color_grey),
               TextAlign::TOP_LEFT, "RH%");

      if (id(sensor_hum).has_state()) {
        char hum_buf[10];
        snprintf(hum_buf, sizeof(hum_buf), "%.1f%%",
                 id(sensor_hum).state);
        float h = id(sensor_hum).state;
        Color hc;
        if (h > 40.0f)      hc = id(color_red);
        else if (h > 30.0f) hc = id(color_orange);
        else if (h > 25.0f) hc = id(color_yellow);
        else                hc = id(color_green);
        it.print(78, 92, id(font_large), hc,
                 TextAlign::TOP_CENTER, hum_buf);
      } else {
        it.print(78, 92, id(font_large), id(color_orange),
                 TextAlign::TOP_CENTER, "---%");
      }
      if (id(vocht_status).has_state()) {
        it.print(78, 126, id(font_small), id(color_cyan),
                 TextAlign::TOP_CENTER,
                 id(vocht_status).state.c_str());
      }

      it.vertical_line(160, 32, 120, id(color_accent));
      it.filled_rectangle(163, 32, 157, 120, id(color_panel_bg));
      it.print(166, 34, id(font_label), id(color_grey),
               TextAlign::TOP_LEFT, "dPa");

      if (id(sensor_pressure).has_state()) {
        char p_buf[12];
        snprintf(p_buf, sizeof(p_buf), "%.2f Pa",
                 id(sensor_pressure).state);
        float p = id(sensor_pressure).state;
        float ap = fabsf(p);
        Color pc;
        if (id(alarm_druk).state)  pc = id(color_red);
        else if (p > 3.0f)         pc = id(color_orange);
        else if (ap >= 0.05f)      pc = id(color_green);
        else                       pc = id(color_cyan);
        it.print(241, 55, id(font_large), pc,
                 TextAlign::TOP_CENTER, p_buf);
      } else {
        it.print(241, 55, id(font_large), id(color_orange),
                 TextAlign::TOP_CENTER, "--- Pa");
      }

      if (id(druk_status).has_state()) {
        Color sc = id(alarm_druk).state
                   ? id(color_red) : id(color_cyan);
        it.print(241, 100, id(font_small), sc,
                 TextAlign::TOP_CENTER,
                 id(druk_status).state.c_str());
      }

      it.horizontal_line(0, 155, 320, id(color_accent));
      it.filled_rectangle(0, 158, 320, 52, id(color_panel_bg));

      if (id(spool_resterend).has_state()) {
        char rem_buf[12];
        bool bijna_op = id(alarm_filament).has_state()
                        && id(alarm_filament).state;
        Color rc = bijna_op ? id(color_red) : id(color_green);
        snprintf(rem_buf, sizeof(rem_buf), "%.0fg",
                 id(spool_resterend).state);
        it.print(10, 162, id(font_large), rc,
                 TextAlign::TOP_LEFT, rem_buf);
        if (bijna_op) {
          it.print(10, 193, id(font_label), id(color_red),
                   TextAlign::TOP_LEFT, "BIJNA OP!");
        }
      } else {
        it.print(10, 162, id(font_large), id(color_orange),
                 TextAlign::TOP_LEFT, "---g");
      }

      if (id(spool_naam).has_state()) {
        it.print(310, 162, id(font_medium), id(color_white),
                 TextAlign::TOP_RIGHT,
                 id(spool_naam).state.c_str());
      }

      if (id(spool_kleur).has_state()) {
        it.print(310, 188, id(font_label), id(color_blue),
                 TextAlign::TOP_RIGHT,
                 id(spool_kleur).state.c_str());
      }

      it.horizontal_line(0, 212, 320, id(color_accent));
      it.filled_rectangle(0, 213, 320, 27, id(color_panel_bg));

      bool alarm_actief = id(alarm_vocht).state
                          || id(alarm_temp).state
                          || id(alarm_druk).state
                          || (id(alarm_filament).has_state()
                              && id(alarm_filament).state);

      if (!alarm_actief) {
        it.print(160, 218, id(font_small), id(color_green),
                 TextAlign::TOP_CENTER,
                 "OK  Alle systemen normaal");
      } else {
        int x = 4;
        if (id(alarm_vocht).state) {
          it.print(x, 218, id(font_small), id(color_red),
                   TextAlign::TOP_LEFT, "VOCHT");
          x += 72;
        }
        if (id(alarm_temp).state) {
          it.print(x, 218, id(font_small), id(color_red),
                   TextAlign::TOP_LEFT, "TEMP");
          x += 62;
        }
        if (id(alarm_druk).state) {
          it.print(x, 218, id(font_small), id(color_red),
                   TextAlign::TOP_LEFT, "DRUK");
          x += 62;
        }
        if (id(alarm_filament).has_state()
            && id(alarm_filament).state) {
          it.print(x, 218, id(font_small), id(color_red),
                   TextAlign::TOP_LEFT, "FILAMENT");
        }
      }