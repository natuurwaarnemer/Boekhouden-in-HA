# ============================================================
# Zigbee Alarm Clock - VOLLEDIGE WERKENDE VERSIE MET DIMMING
# Hardware: ESP32-C6 + SH1106 OLED + Piezo Buzzer + Button
# ============================================================

esphome:
  name: zigbee-alarm-clock
  friendly_name: "Zigbee Wekker"
  on_boot:
    priority: 600
    then:
      - lambda: |-
          id(alarm_active) = false;
          id(next_alarm_str) = std::string("--:--");

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf
    version: recommended

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Wekker Fallback"
    password: "wekker123"

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  services:
    - service: trigger_alarm
      then:
        - script.execute: alarm_start
    - service: stop_alarm
      then:
        - script.execute: alarm_stop

ota:
  - platform: esphome
    password: !secret ota_password

# ------- I2C Bus -------
i2c:
  sda: GPIO22
  scl: GPIO23
  scan: true
  id: bus_a
  frequency: 400kHz

# ------- Fonts -------
font:
  - file: "gfonts://Roboto"
    id: font_time
    size: 32
    glyphs: "0123456789: "

  - file: "gfonts://Roboto"
    id: font_medium
    size: 14
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_abcdefghijklmnopqrstuvwxyz"

  - file: "gfonts://Roboto"
    id: font_small
    size: 12
    glyphs: " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_abcdefghijklmnopqrstuvwxyz"

# ------- OLED Display (SH1106!) -------
display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    address: 0x3C
    id: oled
    update_interval: 500ms
    lambda: |-
      auto now = id(homeassistant_time).now();
      
      // AUTO DIMMING (GEÏNVERTEERD!)
      if (now.is_valid() && !id(alarm_active)) {
        int dim_start = (int)id(dim_start_hour).state;
        int dim_end = (int)id(dim_end_hour).state;
        
        bool is_night = (dim_start > dim_end) 
          ? (now.hour >= dim_start || now.hour < dim_end)
          : (now.hour >= dim_start && now.hour < dim_end);
        
        int brightness = is_night 
          ? (int)id(brightness_night).state 
          : (int)id(brightness_day).state;
        
        id(oled).set_contrast(255 - brightness);
      } else if (id(alarm_active)) {
        id(oled).set_contrast(255 - (int)id(brightness_day).state);
      }

      // --- ALARM MODE ---
      if (id(alarm_active)) {
        static bool blink_state = false;
        blink_state = !blink_state;
        if (blink_state) {
          it.fill(COLOR_ON);
          it.print(64, 8, id(font_time), COLOR_OFF, TextAlign::CENTER, "ALARM");
          it.print(64, 45, id(font_medium), COLOR_OFF, TextAlign::CENTER, "Druk knop!");
        } else {
          it.clear();
          it.print(64, 8, id(font_time), COLOR_ON, TextAlign::CENTER, "ALARM");
          it.print(64, 45, id(font_medium), COLOR_ON, TextAlign::CENTER, "Druk knop!");
        }
        return;
      }

      it.clear();

      // --- TIJD ---
      if (now.is_valid()) {
        static bool show_colon = false;
        show_colon = !show_colon;
        
        char time_str[6];
        if (show_colon) {
          snprintf(time_str, sizeof(time_str), "%02d:%02d", now.hour, now.minute);
        } else {
          snprintf(time_str, sizeof(time_str), "%02d %02d", now.hour, now.minute);
        }
        it.print(64, 10, id(font_time), TextAlign::TOP_CENTER, time_str);
      } else {
        it.print(64, 10, id(font_time), TextAlign::TOP_CENTER, "--:--");
      }

      // --- DATUM ---
      if (now.is_valid()) {
        const char* days[] = {"Zo", "Ma", "Di", "Wo", "Do", "Vr", "Za"};
        const char* months[] = {"", "jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"};
        
        char date_str[20];
        snprintf(date_str, sizeof(date_str), "%s %d %s",
                 days[now.day_of_week - 1], now.day_of_month, months[now.month]);
        it.print(64, 50, id(font_small), TextAlign::TOP_CENTER, date_str);
      }

# ------- Time -------
time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: "Europe/Amsterdam"
    on_time_sync:
      - logger.log: "Tijd gesynchroniseerd met Home Assistant"
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - script.execute: check_alarms
          - script.execute: update_next_alarm

  - platform: sntp
    id: sntp_time
    timezone: "Europe/Amsterdam"
    servers:
      - 0.nl.pool.ntp.org
      - 1.nl.pool.ntp.org
      - pool.ntp.org

# ------- Globals -------
globals:
  - id: alarm_active
    type: bool
    restore_value: false
    initial_value: 'false'

  - id: next_alarm_str
    type: std::string
    restore_value: false
    initial_value: '"--:--"'

  - id: buzzer_step
    type: int
    restore_value: false
    initial_value: '0'

