my_fontspace:
  name: Font spacing
  version: '2.0'
  creator: Natuurwaarnemer
  supported:
    - button
    - climate
    - cover
    - horizontal-buttons-stack
    - media-player
    - pop-up
    - select
    - separator
    - sub-buttons
  description: ''
  code: |-
    ha-card {
      --big-bubble-state-size: ${this.config.my_fontspace?.state_size || 48}px;
      --big-bubble-name-size: ${this.config.my_fontspace?.name_size || 28}px;
      --big-bubble-unit-size: ${this.config.my_fontspace?.unit_size || 22}px;
      --big-bubble-font-family: "${this.config.my_fontspace?.font_family || 'bahnschrift'}";
      --big-bubble-font-weight: ${this.config.my_fontspace?.font_weight || 400};
      --big-bubble-font-style: ${this.config.my_fontspace?.font_style || 'normal'};
      }

    ha-card .bubble-value,
    ha-card .bubble-state,
    ha-card .value,
    ha-card .state,
    ha-card .bubble-entity-value,
    ha-card .bubble-separator-value,
    ha-card .bubble-separator-title {
      font-size: var(--big-bubble-state-size) !important;
      font-family: var(--big-bubble-font-family) !important;
      font-weight: var(--big-bubble-font-weight) !important;
      font-style: var(--big-bubble-font-style) !important;
      line-height: 1 !important;
      white-space: nowrap !important;
    }

    ha-card .bubble-name,
    ha-card .bubble-title {
      font-size: var(--big-bubble-name-size) !important;
      font-family: var(--big-bubble-font-family) !important;
      font-weight: var(--big-bubble-font-weight) !important;
      font-style: var(--big-bubble-font-style) !important;
      line-height: 1 !important;
      white-space: nowrap !important;
    }

    ha-card .bubble-unit,
    ha-card .bubble-entity-unit {
      font-size: var(--big-bubble-unit-size) !important;
      font-family: var(--big-bubble-font-family) !important;
      font-weight: var(--big-bubble-font-weight) !important;
      font-style: var(--big-bubble-font-style) !important;
    }

    ha-card .bubble-sub-button-name,
    ha-card .bubble-sub-button-name-container,
    ha-card .bubble-sub-button-name-container * {
      font-size: var(--big-bubble-name-size) !important;
      font-family: var(--big-bubble-font-family) !important;
      font-weight: var(--big-bubble-font-weight) !important;
      font-style: var(--big-bubble-font-style) !important;
    }

    ha-card .bubble-sub-button-state,
    ha-card .bubble-sub-button-label {
      font-size: var(--big-bubble-name-size) !important;
      font-family: var(--big-bubble-font-family) !important;
      font-weight: var(--big-bubble-font-weight) !important;
      font-style: var(--big-bubble-font-style) !important;
    }

    ha-card svg text {
      font-size: var(--big-bubble-state-size) !important;
      font-family: var(--big-bubble-font-family) !important;
      font-weight: var(--big-bubble-font-weight) !important;
      font-style: var(--big-bubble-font-style) !important;
    }

    ha-card .bubble-sub-button-name-container {
      overflow: visible !important;
      white-space: nowrap !important;
      min-width: fit-content !important;
    }

    ha-card .bubble-sub-button {
      min-width: fit-content !important;
      width: auto !important;
    }
    ha-card .bubble-name-container {
      overflow: visible !important;
    }

    ha-card .bubble-button-card-container {
      overflow: visible !important;
    }

    ha-card .bubble-icon-button-container {
      overflow: visible !important;
    }
