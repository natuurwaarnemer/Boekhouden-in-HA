      selector:
        select:
          mode: dropdown
          options:
            - label: 300 – Light
              value: '300'
            - label: 400 – Regular
              value: '400'
            - label: 500 – Medium
              value: '500'
            - label: 600 – Semi-Bold
              value: '600'
            - label: 700 – Bold
              value: '700'
            - label: 900 – Black
              value: '900'
    - name: font_style
      label: Stijl
      selector:
        select:
          mode: dropdown
          options:
            - label: Normaal
              value: normal
            - label: Cursief (italic)
              value: italic
            - label: Schuin (oblique)
              value: oblique
    - name: state_size
      label: Waarde (state) grootte
      default: 48
      selector:
        number:
          min: 12
          max: 120
          step: 2
          unit_of_measurement: px
          mode: slider
    - name: name_size
      label: Naam / titel grootte
      default: 28
      selector:
        number:
          min: 12
          max: 72
          step: 2
          unit_of_measurement: px
          mode: slider
    - name: unit_size
      label: Eenheid (unit) grootte
      default: 22
      selector:
        number:
          min: 10
          max: 60
          step: 2
          unit_of_measurement: px
          mode: slider
    - name: label_size
      label: Label grootte
      default: 18
      selector:
        number:
          min: 10
          max: 48
          step: 2
          unit_of_measurement: px
          mode: slider
