stat_card:
  name: Statistic Card
  version: '1.2'
  creator: natuurwaarnemer
  description: ''
  code: |-
    ${(() => {
      const cfg = this.config?.stat_card;
      if (!cfg) return '';

      const entity = cfg?.stat_entity || this.config?.entity;
      if (!entity) return '';

      const statType     = cfg.stat_type    ?? 'mean';
      const statPeriod   = cfg.stat_period  ?? 'day';
      const decimals     = parseInt(cfg.stat_decimals ?? 2);
      const neonOverride = cfg.neon_color;

      const haCard = card.querySelector('ha-card') || card;

      if (neonOverride && neonOverride !== '') {
        haCard.style.setProperty('--bc-start', neonOverride);
        haCard.style.setProperty('--bc-end', neonOverride);
        haCard.style.setProperty('--bc-icon-bg', neonOverride);
      }

      const id = 'bcstat_' + entity.replace(/\./g, '_') + '_' + statType + '_' + statPeriod;

      const now = new Date();
      let startTime = new Date(now);

      if (statPeriod === 'day') {
        startTime.setHours(0, 0, 0, 0);
      } else if (statPeriod === 'week') {
        startTime.setDate(now.getDate() - 7);
        startTime.setHours(0, 0, 0, 0);
      } else if (statPeriod === 'month') {
        startTime.setDate(1);
        startTime.setHours(0, 0, 0, 0);
      } else {
        startTime = new Date(now - 24 * 60 * 60 * 1000);
      }

      // Retry tot bubble-state beschikbaar is
      function applyValue(displayValue, attempts) {
        const stateEl = haCard.querySelector('.bubble-state');
        if (stateEl) {
          stateEl.textContent = displayValue;
          stateEl.style.display = '';
        } else if (attempts > 0) {
          setTimeout(() => applyValue(displayValue, attempts - 1), 200);
        }
      }

      async function fetchAndDisplay() {
        try {
          const endIso   = now.toISOString();
          const startIso = startTime.toISOString();

          const history = await hass.callApi(
            'GET',
            'history/period/' + startIso +
            '?filter_entity_id=' + entity +
            '&end_time=' + endIso +
            '&minimal_response'
          );

          if (!history || !history[0] || history[0].length === 0) {
            applyValue('geen data', 10);
            return;
          }

          const states = history[0]
            .map(s => parseFloat(s.state))
            .filter(v => !isNaN(v));

          if (states.length === 0) {
            applyValue('geen data', 10);
            return;
          }

          let value;
          if (statType === 'mean') {
            value = states.reduce((a, b) => a + b, 0) / states.length;
          } else if (statType === 'min') {
            value = Math.min(...states);
          } else if (statType === 'max') {
            value = Math.max(...states);
          } else if (statType === 'sum') {
            value = states.reduce((a, b) => a + b, 0);
          } else if (statType === 'last') {
            value = states[states.length - 1];
          } else {
            value = states.reduce((a, b) => a + b, 0) / states.length;
          }

          const unit = hass.states[entity]?.attributes?.unit_of_measurement ?? '';
          const displayValue = value.toFixed(decimals) + ' ' + unit;

          // 10 pogingen x 200ms = 2 seconden wachten op bubble-state
          applyValue(displayValue, 10);

          const marker = haCard.querySelector('#' + id);
          if (marker) marker.dataset.value = displayValue;

        } catch(e) {
          console.warn('[stat_card module]', e);
        }
      }

      const existing = haCard.querySelector('#' + id);
      if (existing) {
        fetchAndDisplay();
        return '';
      }

      const marker = document.createElement('div');
      marker.id = id;
      marker.style.display = 'none';
      haCard.appendChild(marker);

      setTimeout(() => fetchAndDisplay(), 500);

      return '';
    })()}
  editor:
    - name: stat_entity
      label: 📡 Sensor entity (leeg = zelfde als kaart)
      selector:
        entity: {}
    - name: stat_type
      label: 📊 Statistiek type
      selector:
        select:
          mode: dropdown
          options:
            - label: Gemiddelde (mean)
              value: mean
            - label: Minimum
              value: min
            - label: Maximum
              value: max
            - label: Som
              value: sum
            - label: Laatste waarde
              value: last
    - name: stat_period
      label: ⏱️ Periode
      selector:
        select:
          mode: dropdown
          options:
            - label: Vandaag
              value: day
            - label: 7 dagen
              value: week
            - label: Deze maand
              value: month
    - name: stat_decimals
      label: 🔢 Decimalen
      selector:
        number:
          min: 0
          max: 5
          step: 1
          mode: box
    - name: neon_color
      label: 🌈 Neon gloed kleur (leeg = automatisch)
      selector:
        text: {}
