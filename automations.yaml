- id: toner_verbruik_update
  alias: Update toner verbruik when valid reading
  description: Update persistent verbruik helpers when toner sensors report > 0
  trigger:
  - platform: state
    entity_id:
    - sensor.canon_mf650c_series_canon_cartridge_067_black_toner
    - sensor.canon_mf650c_series_canon_cartridge_067_cyan_toner
    - sensor.canon_mf650c_series_canon_cartridge_067_magenta_to
    - sensor.canon_mf650c_series_canon_cartridge_067_yellow_ton
  action:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''sensor.canon_mf650c_series_canon_cartridge_067_black_toner''
          and (trigger.to_state.state | float(0)) > 0 }}'
      sequence:
      - service: input_number.set_value
        data:
          entity_id: input_number.toner_black_verbruik
          value: '{{ trigger.to_state.state | float(0) }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''sensor.canon_mf650c_series_canon_cartridge_067_cyan_toner''
          and (trigger.to_state.state | float(0)) > 0 }}'
      sequence:
      - service: input_number.set_value
        data:
          entity_id: input_number.toner_cyan_verbruik
          value: '{{ trigger.to_state.state | float(0) }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''sensor.canon_mf650c_series_canon_cartridge_067_magenta_to''
          and (trigger.to_state.state | float(0)) > 0 }}'
      sequence:
      - service: input_number.set_value
        data:
          entity_id: input_number.toner_magenta_verbruik
          value: '{{ trigger.to_state.state | float(0) }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.entity_id == ''sensor.canon_mf650c_series_canon_cartridge_067_yellow_ton''
          and (trigger.to_state.state | float(0)) > 0 }}'
      sequence:
      - service: input_number.set_value
        data:
          entity_id: input_number.toner_yellow_verbruik
          value: '{{ trigger.to_state.state | float(0) }}'
  mode: single
- id: toner_verbruik_init_on_start
  alias: Initialize toner verbruik on startup
  description: Set persistent verbruik helpers on HA start if sensors report > 0
  trigger:
  - platform: homeassistant
    event: start
  action:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.canon_mf650c_series_canon_cartridge_067_black_toner'')
          | float(0) > 0 }}'
      sequence:
      - service: input_number.set_value
        data:
          entity_id: input_number.toner_black_verbruik
          value: '{{ states(''sensor.canon_mf650c_series_canon_cartridge_067_black_toner'')
            | float(0) }}'
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.canon_mf650c_series_canon_cartridge_067_cyan_toner'')
          | float(0) > 0 }}'
      sequence:
      - service: input_number.set_value
        data:
          entity_id: input_number.toner_cyan_verbruik
          value: '{{ states(''sensor.canon_mf650c_series_canon_cartridge_067_cyan_toner'')
            | float(0) }}'
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.canon_mf650c_series_canon_cartridge_067_magenta_to'')
          | float(0) > 0 }}'
      sequence:
      - service: input_number.set_value
        data:
          entity_id: input_number.toner_magenta_verbruik
          value: '{{ states(''sensor.canon_mf650c_series_canon_cartridge_067_magenta_to'')
            | float(0) }}'
    - conditions:
      - condition: template
        value_template: '{{ states(''sensor.canon_mf650c_series_canon_cartridge_067_yellow_ton'')
          | float(0) > 0 }}'
      sequence:
      - service: input_number.set_value
        data:
          entity_id: input_number.toner_yellow_verbruik
          value: '{{ states(''sensor.canon_mf650c_series_canon_cartridge_067_yellow_ton'')
            | float(0) }}'
  mode: single
- id: toner_low_notify
  alias: Toner low notify
  trigger:
  - platform: template
    value_template: '{{ (states(''sensor.canon_mf650c_series_canon_cartridge_067_black_toner'')|float(0))
      < (state_attr(''sensor.canon_mf650c_series_canon_cartridge_067_black_toner'',''marker_low_level'')|float(0))
      }}'
  - platform: template
    value_template: '{{ (states(''sensor.canon_mf650c_series_canon_cartridge_067_cyan_toner'')|float(0))
      < (state_attr(''sensor.canon_mf650c_series_canon_cartridge_067_cyan_toner'',''marker_low_level'')|float(0))
      }}'
  - platform: template
    value_template: '{{ (states(''sensor.canon_mf650c_series_canon_cartridge_067_magenta_to'')|float(0))
      < (state_attr(''sensor.canon_mf650c_series_canon_cartridge_067_magenta_to'',''marker_low_level'')|float(0))
      }}'
  - platform: template
    value_template: '{{ (states(''sensor.canon_mf650c_series_canon_cartridge_067_yellow_ton'')|float(0))
      < (state_attr(''sensor.canon_mf650c_series_canon_cartridge_067_yellow_ton'',''marker_low_level'')|float(0))
      }}'
  condition: []
  action:
  - service: persistent_notification.create
    data:
      title: Toner low
      message: 'Controleer toners:  Black={{ states(''sensor.canon_mf650c_series_canon_cartridge_067_black_toner'')
        }}%, Cyan={{ states(''sensor.canon_mf650c_series_canon_cartridge_067_cyan_toner'')
        }}%, Magenta={{ states(''sensor.canon_mf650c_series_canon_cartridge_067_magenta_to'')
        }}%, Yellow={{ states(''sensor.canon_mf650c_series_canon_cartridge_067_yellow_ton'')
        }}%.'
  mode: single
- id: '1771876951812'
  alias: BirdNET - interessante soorten melding (alleen thuis)
  description: Stuurt een melding naar je telefoon als BirdNET een interessante soort
    detecteert terwijl je thuis bent.
  triggers:
  - entity_id:
    - sensor.birdnet_go_stream_omgezet_last_species
    trigger: state
  conditions:
  - condition: state
    entity_id: device_tracker.ruudmobiel
    state: home
  - condition: template
    value_template: "{{ (trigger.to_state.state if trigger.to_state is not none else
      '') in\n   ['Kraanvogel', 'Bosuil', 'Kerkuil', 'Velduil', 'Goudvink', 'Zwarte
      Mees', 'Waterral', 'Torenvalk', 'Havik', 'Zeearend', 'Visarend', 'Sperwer']
      }}"
  - condition: numeric_state
    entity_id: sensor.birdnet_go_stream_omgezet_confidence
    above: 60
  actions:
  - data:
      title: BirdNET
      message: 'Gedetecteerd: {{ trigger.to_state.state }} (confidence: {{ states(''sensor.birdnet_go_stream_1_confidence'')
        }}%) data: persistent: true priority: high ttl: 0'
    action: notify.mobile_app_sm_s931b
  mode: single
