- id: '1778191498437'
  alias: Filament Droogkast - Hysteresis Controller
  description: ''
  triggers:
  - entity_id: sensor.filament_droogkast_droogkast_temperatuur
    below: 30
    trigger: numeric_state
  - entity_id: sensor.filament_droogkast_droogkast_temperatuur
    above: 35
    trigger: numeric_state
  - entity_id: sensor.filament_droogkast_droogkast_temperatuur
    above: 45
    trigger: numeric_state
  - event: start
    trigger: homeassistant
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: numeric_state
        entity_id: sensor.filament_droogkast_droogkast_temperatuur
        above: 45
      sequence:
      - target:
          entity_id: switch.tz3210_rwmitwj4_ts011f
        action: switch.turn_off
    - conditions:
      - condition: numeric_state
        entity_id: sensor.filament_droogkast_droogkast_temperatuur
        above: 35
      sequence:
      - target:
          entity_id: switch.tz3210_rwmitwj4_ts011f
        action: switch.turn_off
    - conditions:
      - condition: numeric_state
        entity_id: sensor.filament_droogkast_droogkast_temperatuur
        below: 30
      sequence:
      - target:
          entity_id: switch.tz3210_rwmitwj4_ts011f
        action: switch.turn_on
    default: []
  initial_state: true
  mode: single
